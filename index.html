/* ---------- önizleme jestleri: taşı (tek parmak) + yakınlaştır (iki parmak) ---------- */
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}
function pickOverlay(e) {
  const p = canvasPoint(e);
  for (let i = state.overlays.length - 1; i >= 0; i--) {
    const o = state.overlays[i];
    if (state.t < o.start || state.t > o.start + o.dur) continue;
    let w, h;
    if (o.kind === "pip") {
      const src = o.el;
      const sw = o.type === "image" ? src.naturalWidth : src.videoWidth;
      const sh = o.type === "image" ? src.naturalHeight : src.videoHeight;
      w = o.scale;
      h = sw ? o.scale * (sh / sw) * canvas.width / canvas.height : o.scale;
    } else if (o.kind === "sticker") {
      w = o.size * 1.4; h = o.size * 1.6;
    } else {
      w = Math.max(o.content.length * o.size * .35, .1); h = o.size * 1.6;
    }
    if (Math.abs(p.x - o.x) < w / 2 + .03 && Math.abs(p.y - o.y) < h / 2 + .03) return o;
  }
  return null;
}
const gesture = {
  pts: new Map(), target: null, kind: null,   // 'overlay' | 'clip'
  moved: false, startDist: 1, startScale: 1, startSize: 0,
  startX: 0, startY: 0, orig: null,
};
canvas.style.touchAction = "none";

canvas.addEventListener("pointerdown", e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  gesture.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesture.pts.size === 1) {
    gesture.moved = false;
    const hit = pickOverlay(e);
    if (hit) {
      gesture.target = hit; gesture.kind = "overlay";
      if (state.selOv !== hit) { state.selOv = hit; renderTimeline(); }
    } else {
      const loc = locate(state.t);
      gesture.target = loc ? loc.clip : null;
      gesture.kind = gesture.target ? "clip" : null;
    }
    if (gesture.target) pushHistory();
    const p = canvasPoint(e);
    gesture.startX = p.x; gesture.startY = p.y;
    gesture.orig = !gesture.target ? null
      : gesture.kind === "overlay"
        ? { x: gesture.target.x, y: gesture.target.y }
        : { x: gesture.target.tx || 0, y: gesture.target.ty || 0 };
  } else if (gesture.pts.size === 2 && gesture.target) {
    const [a, b] = [...gesture.pts.values()];
    gesture.startDist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    if (gesture.kind === "overlay") {
      gesture.startSize = gesture.target.kind === "pip" ? gesture.target.scale : gesture.target.size;
    } else {
      gesture.startScale = gesture.target.scale || 1;
    }
  }
});
canvas.addEventListener("pointermove", e => {
  if (!gesture.pts.has(e.pointerId) || !gesture.target) return;
  gesture.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesture.pts.size >= 2) {
    /* iki parmak: yakınlaştır / boyutlandır */
    gesture.moved = true;
    const [a, b] = [...gesture.pts.values()];
    const f = (Math.hypot(a.x - b.x, a.y - b.y) || 1) / gesture.startDist;
    if (gesture.kind === "overlay") {
      if (gesture.target.kind === "pip") gesture.target.scale = clamp(gesture.startSize * f, .08, 2);
      else gesture.target.size = clamp(gesture.startSize * f, .02, .4);
    } else {
      gesture.target.scale = clamp(gesture.startScale * f, .2, 5);
    }
    invalidate();
    return;
  }
  /* tek parmak: taşı (+ merkez mıknatısı) */
  const p = canvasPoint(e);
  const dx = p.x - gesture.startX, dy = p.y - gesture.startY;
  const r = canvas.getBoundingClientRect();
  if (!gesture.moved && Math.hypot(dx * r.width, dy * r.height) < 6) return;
  gesture.moved = true;
  gesture.snapX = false; gesture.snapY = false;
  if (gesture.kind === "overlay") {
    let nx = clamp(gesture.orig.x + dx, .02, .98);
    let ny = clamp(gesture.orig.y + dy, .02, .98);
    if (Math.abs(nx - .5) < .022) { nx = .5; gesture.snapX = true; }
    if (Math.abs(ny - .5) < .022) { ny = .5; gesture.snapY = true; }
    gesture.target.x = nx;
    gesture.target.y = ny;
  } else {
    let nx = clamp(gesture.orig.x + dx, -1, 1);
    let ny = clamp(gesture.orig.y + dy, -1, 1);
    if (Math.abs(nx) < .022) { nx = 0; gesture.snapX = true; }
    if (Math.abs(ny) < .022) { ny = 0; gesture.snapY = true; }
    gesture.target.tx = nx;
    gesture.target.ty = ny;
  }
  invalidate();
});
const gestureEnd = e => {
  if (!gesture.pts.has(e.pointerId)) return;
  gesture.pts.delete(e.pointerId);
  if (gesture.pts.size === 0) {
    if (!gesture.moved) handleTap(e);
    gesture.target = null; gesture.kind = null;
    gesture.snapX = false; gesture.snapY = false;
    invalidate();
  }
};
canvas.addEventListener("pointerup", gestureEnd);
canvas.addEventListener("pointercancel", gestureEnd);

/* iTunes arama ucu CORS başlığı göndermiyor; JSONP ile çağrılır */
let jsonpSeq = 0;
function jsonp(url) {
  return new Promise((res, rej) => {
    const cb = "__pcJsonp" + (jsonpSeq++);
    const s = document.createElement("script");
    const cleanup = () => { delete window[cb]; s.remove(); };
    window[cb] = data => { cleanup(); res(data); };
    s.onerror = () => { cleanup(); rej(new Error("jsonp")); };
    s.src = url + "&callback=" + cb;
    document.head.appendChild(s);
    setTimeout(() => { if (window[cb]) { cleanup(); rej(new Error("timeout")); } }, 15000);
  });
}

/* çevrimiçi telifsiz müzik kütüphaneleri */
const MUSIC_LIBS = {
  device: { name: "📱 Cihazım" },
  archive: {
    name: "🏛 İnternet Arşivi",
    async search(q) {
      const u = "https://archive.org/advancedsearch.php?q=" + encodeURIComponent(q + " AND mediatype:audio AND format:MP3") +
        "&fl[]=identifier&fl[]=title&fl[]=creator&rows=15&page=1&output=json";
      const j = await (await fetch(u)).json();
      return (j.response?.docs || []).map(d => ({
        title: d.title || d.identifier,
        artist: Array.isArray(d.creator) ? d.creator[0] : (d.creator || ""),
        resolve: async () => {
          const m = await (await fetch("https://archive.org/metadata/" + d.identifier)).json();
          const f = (m.files || []).find(f => /\.mp3$/i.test(f.name));
          return f ? "https://archive.org/download/" + d.identifier + "/" + encodeURIComponent(f.name) : null;
        },
      }));
    },
  },
  openverse: {
    name: "🌐 Openverse",
    async search(q) {
      const j = await (await fetch("https://api.openverse.org/v1/audio/?page_size=15&q=" + encodeURIComponent(q))).json();
      return (j.results || []).map(x => ({
        title: x.title || "İsimsiz",
        artist: x.creator || "",
        resolve: async () => x.url,
      }));
    },
  },
  itunes: {
    name: "🍎 iTunes (30 sn)",
    async search(q) {
      const j = await jsonp("https://itunes.apple.com/search?media=music&limit=15&term=" + encodeURIComponent(q));
      return (j.results || []).filter(x => x.previewUrl).map(x => ({
        title: x.trackName || "İsimsiz",
        artist: x.artistName || "",
        resolve: async () => x.previewUrl,
      }));
    },
  },
};

let libPreview = null;   // paylaşılan önizleme çalar
function stopLibPreview() {
  if (libPreview) { libPreview.pause(); libPreview = null; }
}

async function addMusicFromUrl(url, name) {
  toast("İndiriliyor…");
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const blob = await r.blob();
  pushHistory();
  const mediaId = uid();
  idbPut("media", { id: mediaId, blob, name, type: blob.type || "audio/mpeg" }).catch(() => {});
  const objUrl = URL.createObjectURL(blob);
  const a = new Audio(objUrl);
  a.preload = "auto";
  await new Promise(res => { a.onloadedmetadata = res; a.onerror = res; });
  const natDur = await resolveDuration(a);
  state.musics.push({
    id: idSeq++, mediaId, name, url: objUrl, el: a,
    natDur, start: state.t, in: 0, out: natDur, speed: 1, volume: .8,
  });
  renderTimeline();
  toast("Müzik eklendi 🎵");
}

function openMusicSheet() {
  let lib = "device";
  openSheet("Müzik", body => {
    const tabs = document.createElement("div");
    tabs.className = "fxTabs";
    body.appendChild(tabs);
    const content = document.createElement("div");
    body.appendChild(content);

    const renderTabs = () => {
      tabs.innerHTML = "";
      for (const [key, l] of Object.entries(MUSIC_LIBS)) {
        const t = document.createElement("button");
        t.className = "fxTab" + (lib === key ? " sel" : "");
        t.textContent = l.name;
        t.onclick = () => { lib = key; stopLibPreview(); renderTabs(); renderContent(); };
        tabs.appendChild(t);
      }
    };

    const renderContent = () => {
      content.innerHTML = "";
      if (lib === "device") {
        const add = document.createElement("button");
        add.className = "sheetBtn primary";
        add.textContent = "🎵 Müzik Dosyası Ekle";
        add.onclick = () => $("#fileMusic").click();
        content.appendChild(add);
        const hint = document.createElement("p");
        hint.style.cssText = "font-size:12px;color:var(--dim);text-align:center;margin-top:6px";
        hint.textContent = state.musics.length
          ? "Düzenlemek için şeritteki müzik çubuğuna dokun: böl, kes, hızlandır, sil."
          : "MP3, M4A, WAV… cihazından ekle ya da üstteki kütüphanelerde ara.";
        content.appendChild(hint);
        return;
      }
      const search = document.createElement("input");
      search.className = "fxSearch";
      search.placeholder = "🔍 Parça ara… (Enter)";
      content.appendChild(search);
      const list = document.createElement("div");
      content.appendChild(list);
      const doSearch = async () => {
        const q = search.value.trim();
        if (!q) return;
        list.innerHTML = `<p style="font-size:12px;color:var(--dim);text-align:center;padding:12px">Aranıyor…</p>`;
        try {
          const results = await MUSIC_LIBS[lib].search(q);
          list.innerHTML = "";
          if (!results.length) {
            list.innerHTML = `<p style="font-size:12px;color:var(--dim);text-align:center;padding:12px">Sonuç yok.</p>`;
            return;
          }
          for (const item of results) {
            const row = document.createElement("div");
            row.className = "libRow";
            row.innerHTML = `
              <button class="pbtn prev">▶</button>
              <span class="linfo"><span class="ltitle"></span><span class="lartist"></span></span>
              <button class="pbtn addb">＋</button>`;
            row.querySelector(".ltitle").textContent = item.title;
            row.querySelector(".lartist").textContent = item.artist;
            const pv = row.querySelector(".prev");
            pv.onclick = async () => {
              if (libPreview && libPreview._src === item) { stopLibPreview(); pv.textContent = "▶"; return; }
              stopLibPreview();
              content.querySelectorAll(".prev").forEach(b => b.textContent = "▶");
              pv.textContent = "…";
              try {
                const u = await item.resolve();
                if (!u) throw new Error("yok");
                libPreview = new Audio(u);
                libPreview._src = item;
                libPreview.play().catch(() => toast("Önizleme çalınamadı"));
                pv.textContent = "⏸";
              } catch (_) { pv.textContent = "▶"; toast("Önizleme alınamadı"); }
            };
            row.querySelector(".addb").onclick = async ev => {
              ev.target.textContent = "…";
              try {
                const u = await item.resolve();
                if (!u) throw new Error("url yok");
                await addMusicFromUrl(u, item.title);
                ev.target.textContent = "✓";
              } catch (err) {
                ev.target.textContent = "＋";
                toast("İndirilemedi — başka parça/kaynak dene");
              }
            };
            list.appendChild(row);
          }
        } catch (_) {
          list.innerHTML = `<p style="font-size:12px;color:var(--dim);text-align:center;padding:12px">Kütüphaneye ulaşılamadı. İnternet bağlantını kontrol et.</p>`;
        }
      };
      search.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); doSearch(); } });
      const go = document.createElement("button");
      go.className = "sheetBtn";
      go.textContent = "Ara";
      go.onclick = doSearch;
      content.insertBefore(go, list);
    };

    renderTabs();
    renderContent();
  });
}

function openMusicSegSheet(m) {
  openSheet("Müzik 🎵 " + m.name, body => {
    sliderRow(body, "Ses", 0, 1, .05, m.volume, v => Math.round(v * 100) + "%", v => m.volume = v);
    sliderRow(body, "Hız", -1, 1, .01, Math.log10(clamp(m.speed, .1, 10)),
      v => Math.pow(10, v).toFixed(2) + "x",
      v => {
        m.speed = clamp(Math.round(Math.pow(10, v) * 100) / 100, .1, 10);
        scheduleTimeline();
      });

    const split = document.createElement("button");
    split.className = "sheetBtn";
    split.textContent = "✂️ Oynatma çubuğunda böl";
    split.onclick = () => {
      const t = state.t;
      const d = musicDur(m);
      if (t <= m.start + .15 || t >= m.start + d - .15) { toast("Bölmek için çubuğu müziğin ortasına getir"); return; }
      const srcT = m.in + (t - m.start) * m.speed;
      const right = {
        ...m, id: idSeq++, start: t, in: srcT,
        el: new Audio(m.url),
      };
      right.el.preload = "auto";
      m.out = srcT;
      state.musics.push(right);
      sheet.classList.remove("open");
      renderTimeline();
      toast("Müzik bölündü");
    };
    body.appendChild(split);

    const toPh = document.createElement("button");
    toPh.className = "sheetBtn";
    toPh.textContent = "⏱ Başlangıcı oynatma çubuğuna al";
    toPh.onclick = () => { m.start = state.t; renderTimeline(); toast("Başlangıç güncellendi"); };
    body.appendChild(toPh);

    const del = document.createElement("button");
    del.className = "sheetBtn danger";
    del.textContent = "Bu Parçayı Sil";
    del.onclick = () => {
      m.el.pause();
      state.musics = state.musics.filter(x => x !== m);
      sheet.classList.remove("open");
      renderTimeline();
      seekTo(Math.min(state.t, totalDur()), true);
    };
    body.appendChild(del);

    const hint = document.createElement("p");
    hint.style.cssText = "font-size:11px;color:var(--dim);text-align:center;margin-top:6px";
    hint.textContent = "İpucu: çubuğu ortadan sürükleyip taşı, uçlarından kırp.";
    body.appendChild(hint);
  });
}

/* ---------- Oran ---------- */
function openAspectSheet() {
  openSheet("En-Boy Oranı", body => {
    const chips = document.createElement("div");
    chips.className = "chips";
    Object.keys(ASPECTS).forEach(k => {
      const b = document.createElement("button");
      b.className = "chip" + (state.aspect === k ? " sel" : "");
      b.textContent = k;
      b.onclick = () => {
        state.aspect = k;
        chips.querySelectorAll(".chip").forEach(x => x.classList.remove("sel"));
        b.classList.add("sel");
        applyAspect();
      };
      chips.appendChild(b);
    });
    body.appendChild(chips);
  });
}
/* seçilen oran + çözünürlükten çift sayıya yuvarlanmış piksel boyutu */
function exportDims() {
  const [rw, rh] = ASPECTS[state.aspect];
  const res = state.resolution;
  const even = v => Math.round(v / 2) * 2;
  return rw <= rh
    ? [even(res), even(res * rh / rw)]
    : [even(res * rw / rh), even(res)];
}
/* çözünürlük ve fps'e göre video bit hızı (~0.22 bit/piksel/kare) */
function exportBitrate() {
  return Math.min(Math.round(state.exportW * state.exportH * state.fps * .22), 16_000_000);
}
function applyAspect() {
  const [w, h] = exportDims();
  state.exportW = w; state.exportH = h;
  fitPreview();
  setCanvasResolution(false);
  drawFrame();
}
/* Önizlemede canvas ekran boyutunda çalışır (kat kat daha az piksel =
   akıcı düzenleme); dışa aktarmada tam çözünürlüğe geçilir. */
function setCanvasResolution(forExport) {
  if (forExport) {
    canvas.width = state.exportW;
    canvas.height = state.exportH;
  } else {
    const box = $("#previewBox");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.min(Math.max(Math.round(box.clientWidth * dpr), 180), state.exportW);
    canvas.width = w;
    canvas.height = Math.round(w * state.exportH / state.exportW);
  }
  noisePat = null;   // desen ölçeği canvas'a bağlı; yeniden üret
  invalidate();
}
function fitPreview() {
  const wrap = $("#previewWrap");
  const availW = wrap.clientWidth - 16, availH = wrap.clientHeight - 16;
  const ar = state.exportW / state.exportH;
  let w = availW, h = w / ar;
  if (h > availH) { h = availH; w = h * ar; }
  const box = $("#previewBox");
  box.style.width = w + "px";
  box.style.height = h + "px";
}
window.addEventListener("resize", () => {
  fitPreview();
  if (!state.rendering) setCanvasResolution(false);
  renderTimeline();
  scrollToTime(true);
});

/* ============================================================
   Dışa aktarma
   1) Hızlı render (CapCut tarzı): WebCodecs ile kare kare offline
      kodlama + offline ses miksajı → oynatma takılsa bile çıktı
      her zaman akıcıdır.
   2) Yedek: MediaRecorder ile gerçek zamanlı kayıt (eski yöntem,
      WebCodecs olmayan tarayıcılar için).
   ============================================================ */
let audioCtx = null, exportAbort = false, recorder = null;
const srcNodes = new Map();

function getSource(el) {
  if (!srcNodes.has(el)) srcNodes.set(el, audioCtx.createMediaElementSource(el));
  return srcNodes.get(el);
}

/* dışa aktarma ayarları paneli (çözünürlük + kare hızı) */

function finishExportUI() {
  state.rendering = false;
  setCanvasResolution(false);
  invalidate();

async function startExport() {
  if (!state.clips.length) return;
  pause();
  saveProject();
  exportAbort = false;

  /* proje ses içeriyor mu? (opus desteklenmiyorsa gerçek zamanlıya düş) */
  const hasAudio = state.clips.some(c => c.type === "video" && c.volume > 0) ||
    state.overlays.some(o => o.kind === "pip" && o.type === "video" && o.volume > 0) ||
    state.musics.length > 0;

  if (window.VideoEncoder) {
    let codec = null;
    for (const c of ["vp09.00.10.08", "vp8"]) {
      try {
        const s = await VideoEncoder.isConfigSupported({ codec: c, width: state.exportW, height: state.exportH });
        if (s.supported) { codec = c; break; }
      } catch (_) {}
    }
    let opusOk = false;
    if (window.AudioEncoder) {
      try {
        const s = await AudioEncoder.isConfigSupported({ codec: "opus", sampleRate: 48000, numberOfChannels: 2, bitrate: 128000 });
        opusOk = !!s.supported;
      } catch (_) {}
    }
    if (codec && (!hasAudio || opusOk)) {
      try {
        await fastRender(codec, hasAudio && opusOk);
        return;
      } catch (err) {
        finishExportUI();
        if (exportAbort) return;
        console.error("fastRender:", err);
        toast("Hızlı render başarısız, gerçek zamanlı kayda geçildi");
      }
    }
  }
  await realtimeExport();
}

/* ---------- hızlı render: yardımcılar ---------- */
function seekVideoExact(v, target) {
  return new Promise(res => {
    if (v.readyState >= 2 && Math.abs(v.currentTime - target) < .01) return res();
    let done = false;
    const fin = () => {
      if (done) return;
      done = true;
      v.removeEventListener("seeked", fin);
      clearTimeout(to);
      res();
    };
    const to = setTimeout(fin, 900);
    v.addEventListener("seeked", fin);
    try { v.currentTime = target; } catch (_) { fin(); }
  });
}

/* geçişteki önceki klip + aktif bindirme videolarını kesin kareye sar */
async function renderSeekExtras(t) {
  const loc = locate(t);
  if (!loc) return;
  const idx = state.clips.indexOf(loc.clip);
  const prev = idx > 0 ? state.clips[idx - 1] : null;
  if (prev && prev.trans.type !== "none" && (t - clipStart(loc.clip)) < prev.trans.dur && prev.type === "video") {
    await seekVideoExact(prev.el, Math.max(prev.out - .05, prev.in));
  }
  for (const o of state.overlays) {
    if (o.kind !== "pip" || o.type !== "video") continue;
    if (t < o.start || t > o.start + o.dur) continue;
    await seekVideoExact(o.el, o.in + (t - o.start));
  }
}

const audioBufCache = new Map();
async function decodeMediaAudio(mediaId) {
  if (audioBufCache.has(mediaId)) return audioBufCache.get(mediaId);
  let buf = null;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const rec = await idbGet("media", mediaId);
    if (rec) buf = await audioCtx.decodeAudioData(await rec.blob.arrayBuffer());
  } catch (_) { buf = null; }
  audioBufCache.set(mediaId, buf);
  return buf;
}

/* tüm ses parçalarını offline miksle → tek AudioBuffer */
async function mixAudioOffline(totalSec) {
  const sr = 48000;
  const oac = new OfflineAudioContext(2, Math.max(Math.ceil(totalSec * sr), sr), sr);
  let any = false, t0 = 0;
  for (const c of state.clips) {
    const d = clipDur(c);
    if (c.type === "video" && c.volume > 0 && c.mediaId) {
      const buf = await decodeMediaAudio(c.mediaId);
      if (buf) {
        const src = oac.createBufferSource();
        src.buffer = buf;
        src.playbackRate.value = c.speed;
        const g = oac.createGain();
        g.gain.value = c.volume;
        src.connect(g).connect(oac.destination);
        try { src.start(t0, Math.min(c.in, buf.duration), Math.max(c.out - c.in, .01)); any = true; } catch (_) {}
      }
    }
    t0 += d;
  }
  /* bindirme (PiP) video sesleri */
  for (const o of state.overlays) {
    if (o.kind !== "pip" || o.type !== "video" || !o.mediaId || o.volume <= 0) continue;
    if (o.start >= totalSec) continue;
    const buf = await decodeMediaAudio(o.mediaId);
    if (!buf) continue;
    const src = oac.createBufferSource();
    src.buffer = buf;
    const g = oac.createGain();
    g.gain.value = o.volume;
    src.connect(g).connect(oac.destination);
    const playDur = Math.min(o.dur, buf.duration - o.in, totalSec - o.start);
    if (playDur > .01) {
      try { src.start(o.start, Math.min(o.in, buf.duration), playDur); any = true; } catch (_) {}
    }
  }
  for (const m of state.musics) {
    if (!m.mediaId || m.volume <= 0 || m.start >= totalSec) continue;
    const buf = await decodeMediaAudio(m.mediaId);
    if (!buf) continue;
    const src = oac.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = m.speed;
    const g = oac.createGain();
    g.gain.value = m.volume;
    src.connect(g).connect(oac.destination);
    const playSrc = Math.min(m.out, buf.duration) - m.in;
    if (playSrc > .01) {
      try { src.start(m.start, Math.min(m.in, buf.duration), playSrc); any = true; } catch (_) {}
    }
  }
  if (!any) return null;
  return oac.startRendering();
}

/* ---------- minimal WebM (Matroska) muxer ---------- */
function mkWebm(opts) {
  const { width, height, codecId, durationMs } = opts;
  const chunks = [];   // {track, ts(ms), key, data}

  const u8cat = arrs => {
    let n = 0;
    for (const a of arrs) n += a.length;
    const out = new Uint8Array(n);
    let o = 0;
    for (const a of arrs) { out.set(a, o); o += a.length; }
    return out;
  };
  const idBytes = id => {
    const b = [];
    while (id > 0) { b.unshift(id & 0xff); id = Math.floor(id / 256); }
    return new Uint8Array(b);
  };
  const vint = n => {   // EBML boyut kodlaması
    let len = 1;
    while (n >= Math.pow(2, 7 * len) - 1 && len < 8) len++;
    const b = new Uint8Array(len);
    for (let i = 0; i < len; i++) b[len - 1 - i] = Math.floor(n / Math.pow(2, 8 * i)) % 256;
    b[0] |= 0x80 >> (len - 1);
    return b;
  };
  const uintBytes = n => {
    const b = [];
    do { b.unshift(n % 256); n = Math.floor(n / 256); } while (n > 0);
    return new Uint8Array(b);
  };
  const f64 = n => {
    const b = new Uint8Array(8);
    new DataView(b.buffer).setFloat64(0, n);
    return b;
  };
  const str = s => new TextEncoder().encode(s);
  const el = (id, payload) => {
    const p = payload instanceof Uint8Array ? payload : u8cat(payload);
    return u8cat([idBytes(id), vint(p.length), p]);
  };

  return {
    addVideo(chunk) {
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      chunks.push({ track: 1, ts: chunk.timestamp / 1000, key: chunk.type === "key", data: d });
    },
    addAudio(chunk) {
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      chunks.push({ track: 2, ts: chunk.timestamp / 1000, key: true, data: d });
    },
    finish({ hasAudio, opusHead }) {
      const header = el(0x1A45DFA3, [
        el(0x4286, uintBytes(1)),  // EBMLVersion
        el(0x42F7, uintBytes(1)),  // EBMLReadVersion
        el(0x42F2, uintBytes(4)),  // EBMLMaxIDLength
        el(0x42F3, uintBytes(8)),  // EBMLMaxSizeLength
        el(0x4282, str("webm")),   // DocType
        el(0x4287, uintBytes(4)),  // DocTypeVersion
        el(0x4285, uintBytes(2)),  // DocTypeReadVersion
      ]);
      const info = el(0x1549A966, [
        el(0x2AD7B1, uintBytes(1000000)),  // TimecodeScale: 1 ms
        el(0x4489, f64(durationMs)),       // Duration
        el(0x4D80, str("PisanCut")),
        el(0x5741, str("PisanCut")),
      ]);
      const videoTrack = el(0xAE, [
        el(0xD7, uintBytes(1)),    // TrackNumber
        el(0x73C5, uintBytes(1)),  // TrackUID
        el(0x83, uintBytes(1)),    // TrackType: video
        el(0x86, str(codecId)),
        el(0xE0, [ el(0xB0, uintBytes(width)), el(0xBA, uintBytes(height)) ]),
      ]);
      const trackList = [videoTrack];
      if (hasAudio) {
        trackList.push(el(0xAE, [
          el(0xD7, uintBytes(2)),
          el(0x73C5, uintBytes(2)),
          el(0x83, uintBytes(2)),    // TrackType: audio
          el(0x86, str("A_OPUS")),
          el(0x56AA, uintBytes(6500000)),    // CodecDelay (ns)
          el(0x56BB, uintBytes(80000000)),   // SeekPreRoll (ns)
          el(0x63A2, opusHead),              // CodecPrivate: OpusHead
          el(0xE1, [ el(0xB5, f64(48000)), el(0x9F, uintBytes(2)) ]),
        ]));
      }
      const tracks = el(0x1654AE6B, trackList);

      chunks.sort((a, b) => (a.ts - b.ts) || (a.track - b.track));
      const clusters = [];
      let cur = null, curTs = 0;
      const flushCluster = () => {
        if (!cur) return;
        clusters.push(el(0x1F43B675, [ el(0xE7, uintBytes(Math.round(curTs))), ...cur ]));
        cur = null;
      };
      for (const c of chunks) {
        const needNew = !cur ||
          (c.track === 1 && c.key && c.ts - curTs >= 1000) ||
          (c.ts - curTs > 30000);
        if (needNew) { flushCluster(); cur = []; curTs = c.ts; }
        const rel = Math.max(Math.round(c.ts - curTs), 0);
        const head = new Uint8Array(4);
        head[0] = 0x80 | c.track;
        head[1] = (rel >> 8) & 0xff;
        head[2] = rel & 0xff;
        head[3] = c.key ? 0x80 : 0x00;
        cur.push(el(0xA3, u8cat([head, c.data])));   // SimpleBlock
      }
      flushCluster();

      /* Segment: bilinmeyen boyut (canlı muxer'lar gibi) — geri yazma gerekmez */
      const segHead = u8cat([idBytes(0x18538067), new Uint8Array([0x01, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff])]);
      return new Blob([header, segHead, info, tracks, ...clusters], { type: "video/webm" });
    },
  };
}

const OPUS_HEAD_DEFAULT = (() => {
  const b = new Uint8Array(19);
  b.set(new TextEncoder().encode("OpusHead"), 0);
  b[8] = 1;             // sürüm
  b[9] = 2;             // kanal
  b[10] = 0x38; b[11] = 0x01;   // preSkip = 312 (LE)
  b[12] = 0x80; b[13] = 0xBB; b[14] = 0x00; b[15] = 0x00;  // 48000 Hz (LE)
  return b;             // gain=0, mapping=0
})();

/* ---------- hızlı render (kare kare, offline) ---------- */
async function fastRender(codec, withAudio) {
  const total = totalDur();
  const fps = state.fps;
  const frames = Math.max(Math.ceil(total * fps), 1);
  exportModal("Render alınıyor…", "Kare kare işleniyor — takılma olmadan, tam kalitede.");

  state.rendering = true;
  pause();
  setCanvasResolution(true);

  let opusHead = OPUS_HEAD_DEFAULT;
  let audioIncluded = false;
  const muxer = mkWebm({
    width: state.exportW, height: state.exportH,
    codecId: codec === "vp8" ? "V_VP8" : "V_VP9",
    durationMs: total * 1000,
  });

  /* 1) ses: offline miksle ve kodla */
  let audioBuffer = null;
  if (withAudio) {
    $("#modalDesc").textContent = "Ses miksleniyor…";
    try { audioBuffer = await mixAudioOffline(total); } catch (_) { audioBuffer = null; }
  }
  if (exportAbort) throw new Error("abort");
  const audioChunks = [];
  if (audioBuffer) {
    const aenc = new AudioEncoder({
      output: (chunk, meta) => {
        const desc = meta && meta.decoderConfig && meta.decoderConfig.description;
        if (desc) {
          opusHead = desc instanceof ArrayBuffer
            ? new Uint8Array(desc)
            : new Uint8Array(desc.buffer, desc.byteOffset, desc.byteLength);
        }
        audioChunks.push(chunk);
      },
      error: e => console.error("AudioEncoder:", e),
    });
    aenc.configure({ codec: "opus", sampleRate: 48000, numberOfChannels: 2, bitrate: 128000 });
    const sr = 48000, block = 960;   // 20 ms opus çerçevesi
    const ch0 = audioBuffer.getChannelData(0);
    const ch1 = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : ch0;
    const maxSamples = Math.min(audioBuffer.length, Math.ceil(total * sr));
    for (let off = 0; off < maxSamples; off += block) {
      const n = Math.min(block, maxSamples - off);
      const data = new Float32Array(n * 2);
      data.set(ch0.subarray(off, off + n), 0);
      data.set(ch1.subarray(off, off + n), n);
      const ad = new AudioData({
        format: "f32-planar", sampleRate: sr,
        numberOfFrames: n, numberOfChannels: 2,
        timestamp: Math.round(off / sr * 1e6), data,
      });
      aenc.encode(ad);
      ad.close();
    }
    await aenc.flush();
    aenc.close();
    audioIncluded = audioChunks.length > 0;
    for (const c of audioChunks) muxer.addAudio(c);
  }
  if (exportAbort) throw new Error("abort");

  /* 2) video: her kareyi kesin zamana sarıp kodla.
     Hızlandırma: her video klip için ikinci bir "gölge" eleman
     oluşturulur; kare i çizilirken kare i+1'in sarması diğer
     elemanda paralel yürür (çift tampon). */
  let encError = null;
  const venc = new VideoEncoder({
    output: chunk => muxer.addVideo(chunk),
    error: e => { encError = e; },
  });
  const vconf = {
    codec, width: state.exportW, height: state.exportH,
    bitrate: exportBitrate(), framerate: fps,
  };
  try { venc.configure({ ...vconf, latencyMode: "realtime" }); }
  catch (_) { venc.configure(vconf); }

  const shadows = new Map();   // clip -> [asıl el, gölge el]
  for (const c of state.clips) {
    if (c.type !== "video") continue;
    const b = document.createElement("video");
    b.preload = "auto"; b.muted = true;
    b.playsInline = true; b.setAttribute("playsinline", "");
    b.src = c.url;
    await new Promise(r => { b.onloadedmetadata = r; b.onerror = r; });
    shadows.set(c, [c.el, b]);
  }
  const issueSeek = i => {
    const t = Math.min(i / fps, Math.max(total - .001, 0));
    const loc = locate(t);
    if (!loc || loc.clip.type !== "video") return { t, clip: null, el: null, promise: Promise.resolve() };
    const el = shadows.get(loc.clip)[i % 2];
    return { t, clip: loc.clip, el, promise: seekVideoExact(el, loc.clip.in + loc.offset * loc.clip.speed) };
  };

  let cur = issueSeek(0);
  for (let i = 0; i < frames; i++) {
    if (exportAbort) { venc.close(); throw new Error("abort"); }
    if (encError) { throw encError; }
    const next = i + 1 < frames ? issueSeek(i + 1) : null;   // paralel ön-sarma
    await cur.promise;
    state.t = cur.t;
    await renderSeekExtras(cur.t);
    /* çizim, sarılmış gölge eleman üzerinden yapılır */
    let savedEl = null;
    if (cur.clip) { savedEl = cur.clip.el; cur.clip.el = cur.el; }
    drawFrame();
    if (cur.clip) cur.clip.el = savedEl;
    const frame = new VideoFrame(canvas, {
      timestamp: Math.round(i * 1e6 / fps),
      duration: Math.round(1e6 / fps),
    });
    venc.encode(frame, { keyFrame: i % (fps * 5) === 0 });
    frame.close();
    /* kodlayıcı kuyruğu şişmesin */
    while (venc.encodeQueueSize > 6 && !encError && !exportAbort) await new Promise(r => setTimeout(r, 2));
    if (i % 5 === 0) {
      $("#progressInner").style.width = (i / frames * 100).toFixed(1) + "%";
      $("#modalDesc").textContent = `Kare ${i + 1} / ${frames}`;
    }
    cur = next;
  }
  await venc.flush();
  venc.close();
  for (const [, pair] of shadows) { pair[1].removeAttribute("src"); pair[1].load(); }
  if (exportAbort) throw new Error("abort");

  const blob = muxer.finish({ hasAudio: audioIncluded, opusHead });
  finishExportUI();
  exportDone(blob, "webm");
  seekTo(0, true);
}

/* ---------- yedek: gerçek zamanlı kayıt (MediaRecorder) ---------- */
async function realtimeExport() {
  const mimes = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm",
    "video/mp4",
  ];
  const mime = mimes.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) { toast("Bu tarayıcı video kaydını desteklemiyor"); return; }
  const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";

  setCanvasResolution(true);
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
  } catch (_) { audioCtx = null; }

  const canvasStream = canvas.captureStream(state.fps);
  let stream = canvasStream;
  if (audioCtx) {
    const dest = audioCtx.createMediaStreamDestination();
    const master = audioCtx.createGain();
    master.connect(audioCtx.destination);
    master.connect(dest);
    const els = state.clips.filter(c => c.type === "video").map(c => c.el);
    for (const o of state.overlays) if (o.kind === "pip" && o.type === "video") els.push(o.el);
    for (const m of state.musics) els.push(m.el);
    for (const el of new Set(els)) {
      try { getSource(el).disconnect(); } catch (_) {}
      try { getSource(el).connect(master); } catch (_) {}
    }
    stream = new MediaStream([...canvasStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  }

  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: exportBitrate() });
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

  exportModal("Dışa aktarılıyor…", "Video gerçek zamanlı işleniyor, sekmeyi kapatma.");

  const done = new Promise(res => recorder.onstop = res);
  seekTo(0, true);
  await new Promise(r => setTimeout(r, 250)); // ilk kare otursun
  recorder.start(500);
  play();

  const total = totalDur();
  await new Promise(res => {
    const iv = setInterval(() => {
      $("#progressInner").style.width = Math.min(state.t / total * 100, 100) + "%";
      if (exportAbort || (!state.playing && state.t >= total - .05)) {
        clearInterval(iv);
        res();
      }
    }, 120);
  });

  if (recorder.state !== "inactive") recorder.stop();
  await done;
  pause();
  finishExportUI();

  if (exportAbort) return;

  const blob = new Blob(chunks, { type: mime.split(";")[0] });
  exportDone(blob, ext);
}

/* ---------- proje kaydet / yükle ---------- */
function projectData() {
  return {
    aspect: state.aspect,
    resolution: state.resolution,
    fps: state.fps,
    clips: state.clips.map(c => ({
      mediaId: c.mediaId, type: c.type, name: c.name, natDur: c.natDur,
      in: c.in, out: c.out, speed: c.speed, volume: c.volume,
      pitchShift: c.pitchShift, tx: c.tx, ty: c.ty, scale: c.scale,
      filter: c.filter, adjust: { ...c.adjust }, effect: c.effect, trans: { ...c.trans },
    })),
    /* el/url DOM nesneleri IDB'ye yazılamaz; medya mediaId ile geri yüklenir */
    overlays: state.overlays.map(o => { const { el, url, ...rest } = o; return { ...rest }; }),
    musics: state.musics.map(m => ({
      mediaId: m.mediaId, name: m.name, natDur: m.natDur,
      start: m.start, in: m.in, out: m.out, speed: m.speed, volume: m.volume,
    })),
  };
}

async function saveProject() {
  if (!state.projectId) return;
  if (!state.clips.length && !state.overlays.length) return;
  const data = projectData();
  const s = JSON.stringify(data);
  if (s === lastSavedJson) return;
  lastSavedJson = s;
  await idbPut("projects", {
    id: state.projectId,
    name: state.projectName,
    updatedAt: Date.now(),
    dur: totalDur(),
    thumb: state.clips.find(c => c.thumb)?.thumb || null,
    data,
  }).catch(() => {});
}
/* otomatik kayıt: editördeyken her 2.5 sn'de değişiklik varsa yaz */
setInterval(() => { if ($("#home").style.display === "none") saveProject(); }, 2500);
window.addEventListener("pagehide", () => saveProject());
document.addEventListener("visibilitychange", () => { if (document.hidden) saveProject(); });

function resetEditorState() {
  pause();
  state.clips = [];
  state.overlays = [];
  for (const m of state.musics) m.el.pause();
  state.musics = [];
  state.t = 0;
  state.selClip = null;
  state.selOv = null;
  lastSavedJson = "";
  $("#emptyState").style.display = "flex";
  $("#btnExport").disabled = true;
}

async function newProject(tool) {
  resetEditorState();
  state.projectId = "p" + Date.now();
  const all = await idbAll("projects").catch(() => []);
  state.projectName = "Proje " + (all.length + 1);
  state.aspect = "9:16";
  state.resolution = 720;
  state.fps = 30;
  applyAspect();
  clearHistory();
  pendingTool = tool || null;
  enterEditor();
  $("#fileVideo").click();
}

async function openProject(rec) {
  resetEditorState();
  state.projectId = rec.id;
  state.projectName = rec.name;
  state.aspect = rec.data.aspect || "9:16";
  state.resolution = rec.data.resolution || 720;
  state.fps = rec.data.fps || 30;
  applyAspect();
  toast("Proje açılıyor…");
  for (const cd of rec.data.clips) {
    const m = await idbGet("media", cd.mediaId).catch(() => null);
    if (!m) continue;
    const url = URL.createObjectURL(m.blob);
    let el;
    if (cd.type === "image") {
      el = new Image();
      await new Promise(r => { el.onload = r; el.onerror = r; el.src = url; });
    } else {
      el = document.createElement("video");
      el.preload = "auto";
      el.playsInline = true; el.setAttribute("playsinline", "");
      el.addEventListener("seeked", invalidate);
      el.src = url;
      await new Promise(r => { el.onloadedmetadata = r; el.onerror = r; });
    }
    const c = { ...mkClip(cd.type, url, cd.name, el, cd.natDur), ...cd, el, url, thumb: null };
    c.id = idSeq++;
    c.adjust = { ...cd.adjust };
    c.trans = { ...cd.trans };
    if (cd.type === "image") c.thumb = makeThumb(el, el.naturalWidth, el.naturalHeight);
    else grabThumb(c);
    state.clips.push(c);
  }
  state.overlays = [];
  for (const od of rec.data.overlays || []) {
    const o = { ...od, id: idSeq++ };
    if (o.kind === "pip") {
      const m = await idbGet("media", o.mediaId).catch(() => null);
      if (!m) continue;
      o.url = URL.createObjectURL(m.blob);
      if (o.type === "image") {
        o.el = new Image();
        await new Promise(r => { o.el.onload = r; o.el.onerror = r; o.el.src = o.url; });
      } else {
        o.el = document.createElement("video");
        o.el.preload = "auto";
        o.el.playsInline = true; o.el.setAttribute("playsinline", "");
        o.el.addEventListener("seeked", invalidate);
        o.el.src = o.url;
        await new Promise(r => { o.el.onloadedmetadata = r; o.el.onerror = r; });
      }
    }
    state.overlays.push(o);
  }
  /* müzik parçaları (eski tek müzikli kayıtlarla geriye uyumlu) */
  const musicDefs = rec.data.musics ||
    (rec.data.music ? [{ ...rec.data.music, start: 0, in: 0, out: null, speed: 1 }] : []);
  state.musics = [];
  for (const md of musicDefs) {
    const rec2 = await idbGet("media", md.mediaId).catch(() => null);
    if (!rec2) continue;
    const url = URL.createObjectURL(rec2.blob);
    const a = new Audio(url);
    a.preload = "auto";
    await new Promise(r => { a.onloadedmetadata = r; a.onerror = r; });
    const natDur = md.natDur || (isFinite(a.duration) ? a.duration : 60);
    state.musics.push({
      id: idSeq++, mediaId: md.mediaId, name: md.name, url, el: a,
      natDur, start: md.start || 0, in: md.in || 0,
      out: md.out == null ? natDur : md.out,
      speed: md.speed || 1, volume: md.volume ?? .8,
    });
  }
  lastSavedJson = JSON.stringify(projectData());
  clearHistory();
  if (state.clips.length) {
    $("#emptyState").style.display = "none";
    $("#btnExport").disabled = false;
  }
  enterEditor();
  seekTo(0, true);
}

async function deleteProject(rec) {
  if (!confirm(`"${rec.name}" silinsin mi?`)) return;
  await idbDel("projects", rec.id).catch(() => {});
  /* başka projede kullanılmayan medyaları temizle */
  const remaining = await idbAll("projects").catch(() => []);
  const used = new Set();
  for (const p of remaining) {
    (p.data.clips || []).forEach(c => used.add(c.mediaId));
    (p.data.overlays || []).forEach(o => { if (o.mediaId) used.add(o.mediaId); });
    (p.data.musics || []).forEach(m => used.add(m.mediaId));
    if (p.data.music) used.add(p.data.music.mediaId);
  }
  const ids = new Set();
  (rec.data.clips || []).forEach(c => ids.add(c.mediaId));
  (rec.data.overlays || []).forEach(o => { if (o.mediaId) ids.add(o.mediaId); });
  (rec.data.musics || []).forEach(m => ids.add(m.mediaId));
  if (rec.data.music) ids.add(rec.data.music.mediaId);
  for (const id of ids) if (!used.has(id)) await idbDel("media", id).catch(() => {});
  renderProjectList();
}

function renameProject(rec) {
  const name = prompt("Proje adı:", rec.name);
  if (!name) return;
  rec.name = name.trim() || rec.name;
  idbPut("projects", rec).then(renderProjectList).catch(() => {});
  if (state.projectId === rec.id) state.projectName = rec.name;
}

/* ---------- ana ekran ---------- */
async function renderProjectList() {
  const list = $("#projList");
  const all = (await idbAll("projects").catch(() => []))
    .sort((a, b) => b.updatedAt - a.updatedAt);
  list.innerHTML = "";
  if (!all.length) {
    list.innerHTML = `<div id="projEmpty">Henüz proje yok.<br>Başlamak için “＋ Yeni proje”ye dokun.</div>`;
    return;
  }
  for (const rec of all) {
    const card = document.createElement("button");
    card.className = "projCard";
    const d = new Date(rec.updatedAt);
    const dateStr = d.toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit" }) +
      " " + d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    card.innerHTML = `
      <span class="pthumb"${rec.thumb ? ` style="background-image:url(${rec.thumb})"` : ""}></span>
      <span class="pinfo">
        <span class="pname">${rec.name.replace(/</g, "&lt;")}</span>
        <span class="pmeta">${fmt(rec.dur || 0)} · ${dateStr}</span>
      </span>
      <span class="pbtn ren">✏️</span>
      <span class="pbtn del">🗑</span>`;
    card.querySelector(".ren").addEventListener("click", e => { e.stopPropagation(); renameProject(rec); });
    card.querySelector(".del").addEventListener("click", e => { e.stopPropagation(); deleteProject(rec); });
    card.addEventListener("click", () => openProject(rec));
    list.appendChild(card);
  }
}

function showHome() {
  saveProject();
  pause();
  $("#home").style.display = "flex";
  renderProjectList();
}
function enterEditor() {
  $("#home").style.display = "none";
  fitPreview();
  renderAll();
}

$("#btnHome").onclick = showHome;
$("#btnNewProject").onclick = () => newProject();
$("#btnNewPhoto").onclick = () => newProject();
document.querySelectorAll(".hTool").forEach(b => {
  b.addEventListener("click", () => newProject(b.dataset.htool));
});
document.querySelectorAll("#homeNav button").forEach(b => {
  b.addEventListener("click", () => {
    if (b.dataset.nav === "projects") $("#projSection").scrollIntoView({ behavior: "smooth" });
    else if (b.dataset.nav === "soon") toast("Yakında ✨");
  });
});

/* ---------- başlangıç ---------- */
applyAspect();
renderAll();
showHome();
</script>
