<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Pisan Cut — Mobil Video Editörü</title>
<style>
  :root {
    --bg: #0b0b0f;
    --bg2: #15151c;
    --bg3: #1e1e28;
    --line: #2a2a38;
    --text: #f2f2f7;
    --dim: #8e8e9d;
    --accent: #2dd4bf;
    --accent2: #0ea5b7;
    --danger: #f43f5e;
    --radius: 12px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display:flex; flex-direction:column;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
    height:100dvh;
  }
  button { font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  input[type=range] { accent-color:var(--accent); }

  /* ---------- Üst bar ---------- */
  #topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(8px + var(--safe-t)) 12px 8px;
    flex:0 0 auto;
  }
  #topbar .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; letter-spacing:.3px; }
  #topbar .brand .logo {
    width:26px; height:26px; border-radius:8px; display:grid; place-items:center;
    background:linear-gradient(135deg, var(--accent), #818cf8); color:#06060a; font-size:13px; font-weight:900;
  }
  #btnExport {
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#04211e; font-weight:700; font-size:13px;
    padding:8px 16px; border-radius:999px;
  }
  #btnExport:disabled { opacity:.4; }

  /* ---------- Önizleme ---------- */
  #previewWrap {
    flex:1 1 auto; min-height:120px;
    display:grid; place-items:center;
    position:relative; overflow:hidden;
    background:#000;
  }
  #previewBox { position:relative; max-width:100%; max-height:100%; }
  #canvas { display:block; width:100%; height:100%; background:#000; border-radius:4px; }
  #emptyState {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:var(--dim); font-size:14px; text-align:center; padding:20px;
  }
  #emptyState .big {
    width:74px; height:74px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), #818cf8);
    color:#06060a; font-size:38px; font-weight:300; line-height:1;
    display:grid; place-items:center;
  }
  #playOverlay {
    position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
  }
  #playOverlay .ring {
    width:58px; height:58px; border-radius:50%;
    background:rgba(10,10,14,.55); backdrop-filter:blur(4px);
    display:grid; place-items:center; font-size:22px; color:#fff;
    opacity:0; transition:opacity .15s;
  }
  #playOverlay.show .ring { opacity:1; }

  /* ---------- Oynatma satırı ---------- */
  #transport {
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:6px 14px;
  }
  #timeLabel { font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; min-width:86px; }
  #btnPlay {
    width:38px; height:38px; border-radius:50%; background:var(--bg3);
    display:grid; place-items:center; font-size:15px;
  }
  #transport .spacer { flex:1; }
  .iconBtn {
    width:34px; height:34px; border-radius:9px; background:var(--bg3);
    display:grid; place-items:center; font-size:15px; color:var(--text);
  }
  .iconBtn:disabled { opacity:.35; }

  /* ---------- Zaman çizelgesi ---------- */
  #timelineArea { flex:0 0 auto; position:relative; background:var(--bg2); border-top:1px solid var(--line); }
  #playhead {
    position:absolute; top:0; bottom:0; left:50%; width:2px; margin-left:-1px;
    background:#fff; z-index:5; pointer-events:none;
  }
  #playhead::before {
    content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#fff;
  }
  #tlScroll {
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none;
  }
  #tlScroll::-webkit-scrollbar { display:none; }
  #tlContent { position:relative; padding:8px 0 10px; width:max-content; min-width:100%; }

  #ruler { height:16px; position:relative; margin-bottom:6px; }
  #ruler .tick { position:absolute; top:0; font-size:9px; color:var(--dim); transform:translateX(-50%); font-variant-numeric:tabular-nums; }
  #ruler .tick::after { content:""; position:absolute; left:50%; top:12px; width:1px; height:3px; background:var(--line); }

  #textTrack { height:22px; position:relative; margin-bottom:4px; }
  .textBar {
    position:absolute; top:2px; height:17px; border-radius:5px;
    background:linear-gradient(135deg,#818cf8,#c084fc);
    font-size:9px; line-height:17px; color:#0b0b14; font-weight:700;
    padding:0 6px; overflow:hidden; white-space:nowrap;
    touch-action:none;
  }
  .textBar.stk { background:linear-gradient(135deg,#fb923c,#f472b6); }
  .textBar.pip { background:linear-gradient(135deg,#34d399,#0ea5b7); }
  .textBar.sel { outline:2px solid #fff; }
  .textBar.sel::before, .textBar.sel::after {
    content:""; position:absolute; top:4px; bottom:4px; width:2px;
    background:rgba(0,0,0,.5); border-radius:2px;
  }
  .textBar.sel::before { left:3px; }
  .textBar.sel::after { right:3px; }

  /* CapCut tarzı efekt paneli */
  .fxSearch {
    width:100%; background:var(--bg3); border:1px solid var(--line); border-radius:999px;
    color:var(--text); font-size:13px; padding:10px 16px; margin-bottom:10px;
    font-family:inherit; user-select:text; -webkit-user-select:text;
  }
  .fxSearch::placeholder { color:var(--dim); }
  .fxTabs { display:flex; gap:16px; overflow-x:auto; margin-bottom:12px; scrollbar-width:none; }
  .fxTabs::-webkit-scrollbar { display:none; }
  .fxTab { font-size:13px; color:var(--dim); padding:4px 2px 6px; border-bottom:2px solid transparent; flex:0 0 auto; }
  .fxTab.sel { color:var(--text); font-weight:700; border-color:var(--accent); }
  .fxGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px 10px; }
  .fxTile { display:flex; flex-direction:column; gap:6px; }
  .fxTile .tile {
    width:100%; aspect-ratio:1; border-radius:14px; border:2px solid transparent;
    display:grid; place-items:center; font-size:30px;
  }
  .fxTile.sel .tile { border-color:#fff; }
  .fxTile .nm { font-size:11px; color:var(--dim); text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fxTile.sel .nm { color:var(--text); }
  .halfRow { display:flex; gap:8px; }
  .halfRow .sheetBtn { flex:1; margin:8px 0 0; }
  .libRow {
    display:flex; align-items:center; gap:10px;
    padding:8px 2px; border-bottom:1px solid var(--line);
  }
  .libRow .pbtn {
    width:34px; height:34px; border-radius:9px; background:var(--bg3);
    display:grid; place-items:center; font-size:14px; flex:0 0 auto;
  }
  .libRow .linfo { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .libRow .ltitle { font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .libRow .lartist { font-size:10px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #clipTrack { height:56px; position:relative; display:flex; align-items:center; }
  .clip {
    position:relative; height:52px; flex:0 0 auto;
    border-radius:8px; overflow:hidden; background:var(--bg3);
    background-size:auto 100%; background-repeat:repeat-x;
    outline:1px solid rgba(255,255,255,.08); outline-offset:-1px;
  }
  .clip.sel { outline:2px solid var(--accent); outline-offset:-2px; }
  .clip .badge {
    position:absolute; left:4px; bottom:3px;
    font-size:8px; font-weight:700; color:#fff;
    background:rgba(0,0,0,.55); border-radius:4px; padding:1px 4px;
    pointer-events:none;
  }
  .handle {
    position:absolute; top:0; bottom:0; width:22px; z-index:3;
    display:none; touch-action:none;
  }
  .clip.sel .handle { display:block; }
  .handle::after {
    content:""; position:absolute; top:0; bottom:0; width:14px;
    background:var(--accent); display:grid;
  }
  .handle.l { left:0; } .handle.l::after { left:0; border-radius:8px 0 0 8px; }
  .handle.r { right:0; } .handle.r::after { right:0; border-radius:0 8px 8px 0; }
  .handle::before {
    content:""; position:absolute; top:50%; transform:translateY(-50%); z-index:1;
    width:2px; height:16px; background:rgba(0,0,0,.55); border-radius:2px;
  }
  .handle.l::before { left:5px; } .handle.r::before { right:5px; }
  .transBtn {
    position:absolute; top:50%; transform:translate(-50%,-50%);
    width:22px; height:22px; border-radius:7px; z-index:4;
    background:var(--bg); border:1px solid var(--line); color:var(--dim);
    font-size:10px; display:grid; place-items:center; line-height:1;
  }
  .transBtn.on { background:var(--accent); border-color:var(--accent); color:#04211e; font-weight:900; }
  #addClipBtn {
    flex:0 0 auto; width:40px; height:52px; margin-left:8px;
    border-radius:8px; background:var(--bg3); color:var(--dim);
    font-size:20px; display:grid; place-items:center;
  }
  #musicRow {
    height:22px; position:relative; margin-top:4px;
  }
  .musicSeg {
    position:absolute; top:2px; height:17px; border-radius:5px;
    background:repeating-linear-gradient(90deg, #14532d 0 6px, #166534 6px 12px);
    color:#bbf7d0; font-size:9px; line-height:17px; padding:0 6px;
    overflow:hidden; white-space:nowrap; touch-action:none;
  }
  .musicSeg.sel { outline:2px solid #fff; }

  /* ---------- Alt araç çubuğu ---------- */
  #toolbar {
    flex:0 0 auto; display:flex; overflow-x:auto; gap:2px;
    padding:6px 8px calc(8px + var(--safe-b));
    background:var(--bg2); border-top:1px solid var(--line);
    scrollbar-width:none;
  }
  #toolbar::-webkit-scrollbar { display:none; }
  .tool {
    flex:0 0 auto; width:58px; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 0; border-radius:10px; color:var(--text);
  }
  .tool .ic { font-size:19px; }
  .tool .lb { font-size:10px; color:var(--dim); }
  .tool:active { background:var(--bg3); }
  .tool.disabled { opacity:.35; pointer-events:none; }

  /* ---------- Panel (bottom sheet) ---------- */
  #sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--bg2); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    padding:10px 16px calc(16px + var(--safe-b));
    transform:translateY(105%); transition:transform .22s ease;
    max-height:62dvh; overflow-y:auto;
  }
  #sheet.open { transform:translateY(0); }
  #sheetHead { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  #sheetTitle { font-size:14px; font-weight:700; }
  #sheetClose { font-size:13px; color:var(--accent); font-weight:600; padding:4px 8px; }
  .row { display:flex; align-items:center; gap:12px; margin:12px 0; }
  .row label { font-size:12px; color:var(--dim); min-width:70px; }
  .row input[type=range] { flex:1; }
  .row .val { font-size:12px; min-width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    padding:8px 14px; border-radius:999px; background:var(--bg3);
    font-size:12px; color:var(--text); border:1px solid transparent;
  }
  .chip.sel { border-color:var(--accent); color:var(--accent); font-weight:700; }
  .subhead { font-size:11px; color:var(--dim); font-weight:700; letter-spacing:.5px; text-transform:uppercase; margin:14px 0 8px; }
  .filterGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .fItem { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .fItem .sw {
    width:100%; aspect-ratio:1; border-radius:10px; border:2px solid transparent;
    background:linear-gradient(135deg,#f59e0b,#3b82f6,#10b981);
  }
  .fItem .em {
    width:100%; aspect-ratio:1; border-radius:10px; border:2px solid transparent;
    background:var(--bg3); display:grid; place-items:center; font-size:26px;
  }
  .fItem.sel .sw, .fItem.sel .em { border-color:var(--accent); }
  .fItem .nm { font-size:10px; color:var(--dim); }
  .fItem.sel .nm { color:var(--accent); }
  .emojiGrid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .emojiGrid button {
    aspect-ratio:1; font-size:26px; background:var(--bg3); border-radius:10px;
    display:grid; place-items:center;
  }
  .sheetBtn {
    display:block; width:100%; text-align:center;
    background:var(--bg3); border-radius:var(--radius);
    padding:12px; font-size:13px; font-weight:600; margin:8px 0;
  }
  .sheetBtn.primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#04211e; }
  .sheetBtn.danger { color:var(--danger); }
  textarea#textInput {
    width:100%; background:var(--bg3); border:1px solid var(--line); border-radius:var(--radius);
    color:var(--text); font-size:14px; padding:10px; resize:none; height:64px;
    font-family:inherit; user-select:text; -webkit-user-select:text;
  }
  .colorRow { display:flex; gap:8px; flex-wrap:wrap; }
  .colorDot { width:30px; height:30px; border-radius:50%; border:2px solid transparent; }
  .colorDot.sel { border-color:#fff; }

  /* ---------- Dışa aktarma modalı ---------- */
  #modal {
    position:fixed; inset:0; z-index:100; display:none;
    background:rgba(5,5,8,.82); backdrop-filter:blur(6px);
    place-items:center; padding:24px;
  }
  #modal.open { display:grid; }
  #modalCard {
    width:100%; max-width:320px; background:var(--bg2); border:1px solid var(--line);
    border-radius:18px; padding:22px; text-align:center;
  }
  #modalCard h3 { font-size:15px; margin-bottom:6px; }
  #modalCard p { font-size:12px; color:var(--dim); margin-bottom:14px; }
  #progressOuter { height:6px; background:var(--bg3); border-radius:999px; overflow:hidden; margin-bottom:14px; }
  #progressInner { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#818cf8); transition:width .2s; }
  #modalCard .sheetBtn { margin:6px 0 0; }
  #dlLink { display:none; }

  #toast {
    position:fixed; left:50%; bottom:calc(120px + var(--safe-b)); transform:translateX(-50%) translateY(20px);
    background:rgba(30,30,40,.95); border:1px solid var(--line);
    padding:9px 16px; border-radius:999px; font-size:12px; z-index:90;
    opacity:0; pointer-events:none; transition:all .2s; white-space:nowrap;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Ana ekran (proje menüsü) ---------- */
  #home {
    position:fixed; inset:0; z-index:60;
    background:var(--bg);
    display:flex; flex-direction:column;
  }
  #homeScroll { flex:1; overflow-y:auto; padding:calc(14px + var(--safe-t)) 16px 20px; }
  #homeBrand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:17px; margin-bottom:16px; }
  #homeBrand .logo {
    width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
    background:linear-gradient(135deg, var(--accent), #818cf8); color:#06060a; font-size:15px; font-weight:900;
  }
  #homeTop { display:flex; gap:10px; margin-bottom:22px; }
  #btnNewProject {
    flex:2.4; height:76px; border-radius:16px;
    background:linear-gradient(135deg,#a8c7fa,#c5d9fb);
    display:grid; place-items:center;
  }
  #btnNewProject .plus {
    width:44px; height:44px; border-radius:13px; background:#15151c;
    display:grid; place-items:center; color:#fff; font-size:24px; font-weight:300;
  }
  #btnNewPhoto {
    flex:1; height:76px; border-radius:16px;
    background:linear-gradient(135deg,#9fbef5,#b9cff8);
    display:grid; place-items:center; font-size:26px;
  }
  .homeGrid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:22px 8px;
    margin-bottom:26px;
  }
  .hTool { display:flex; flex-direction:column; align-items:center; gap:7px; color:var(--text); }
  .hTool .ic {
    width:46px; height:46px; border-radius:13px; background:var(--bg3);
    display:grid; place-items:center; font-size:21px;
  }
  .hTool .lb { font-size:11px; color:var(--dim); text-align:center; }
  #projSection h2 { font-size:14px; font-weight:700; margin-bottom:10px; }
  .projCard {
    display:flex; align-items:center; gap:12px;
    background:var(--bg2); border:1px solid var(--line); border-radius:14px;
    padding:10px; margin-bottom:10px; width:100%; text-align:left;
  }
  .projCard .pthumb {
    width:66px; height:48px; border-radius:8px; background:var(--bg3) center/cover;
    flex:0 0 auto;
  }
  .projCard .pinfo { flex:1; min-width:0; }
  .projCard .pname { font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .projCard .pmeta { font-size:11px; color:var(--dim); margin-top:3px; }
  .projCard .pbtn {
    width:32px; height:32px; border-radius:8px; background:var(--bg3);
    display:grid; place-items:center; font-size:13px; flex:0 0 auto;
  }
  #projEmpty { color:var(--dim); font-size:12px; text-align:center; padding:22px 0; }
  #homeNav {
    flex:0 0 auto; display:flex; justify-content:space-around;
    padding:8px 4px calc(10px + var(--safe-b));
    background:var(--bg2); border-top:1px solid var(--line);
  }
  #homeNav button { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--dim); width:60px; }
  #homeNav button .nic { font-size:18px; }
  #homeNav button.act { color:var(--text); font-weight:700; }
  #btnHome {
    width:32px; height:32px; border-radius:9px; background:var(--bg3);
    display:grid; place-items:center; font-size:18px; margin-right:2px;
  }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand"><button id="btnHome" title="Projelere dön">‹</button><span class="logo">P</span> Pisan Cut</div>
  <button id="btnExport" disabled>Dışa Aktar</button>
</header>

<main id="previewWrap">
  <div id="previewBox">
    <canvas id="canvas" width="720" height="1280"></canvas>
    <div id="playOverlay"><div class="ring">▶</div></div>
  </div>
  <div id="emptyState">
    <button class="big" id="btnEmptyAdd">+</button>
    <div>Başlamak için video veya fotoğraf ekle</div>
  </div>
</main>

<div id="transport">
  <button id="btnPlay">▶</button>
  <span id="timeLabel">00:00.0 / 00:00.0</span>
  <span class="spacer"></span>
  <button class="iconBtn" id="btnUndo" title="Geri al (Ctrl+Z)" disabled>↩</button>
  <button class="iconBtn" id="btnRedo" title="Yinele (Ctrl+X)" disabled>↪</button>
  <button class="iconBtn" id="btnUndoDel" title="Klibi sil" disabled>🗑</button>
  <button class="iconBtn" id="btnZoomOut" title="Uzaklaş">−</button>
  <button class="iconBtn" id="btnZoomIn" title="Yakınlaş">+</button>
</div>

<section id="timelineArea">
  <div id="playhead"></div>
  <div id="tlScroll">
    <div id="tlContent">
      <div id="ruler"></div>
      <div id="textTrack"></div>
      <div id="clipTrack"></div>
      <div id="musicRow"></div>
    </div>
  </div>
</section>

<nav id="toolbar">
  <button class="tool" data-tool="add"><span class="ic">➕</span><span class="lb">Ekle</span></button>
  <button class="tool needsel" data-tool="split"><span class="ic">✂️</span><span class="lb">Böl</span></button>
  <button class="tool needsel" data-tool="transition"><span class="ic">⇄</span><span class="lb">Geçiş</span></button>
  <button class="tool needsel" data-tool="effect"><span class="ic">✨</span><span class="lb">Efekt</span></button>
  <button class="tool needsel" data-tool="speed"><span class="ic">⏩</span><span class="lb">Hız</span></button>
  <button class="tool needsel" data-tool="volume"><span class="ic">🔊</span><span class="lb">Ses</span></button>
  <button class="tool needsel" data-tool="filter"><span class="ic">🎨</span><span class="lb">Filtre</span></button>
  <button class="tool needsel" data-tool="adjust"><span class="ic">🎛️</span><span class="lb">Ayarla</span></button>
  <button class="tool" data-tool="text"><span class="ic">🅣</span><span class="lb">Metin</span></button>
  <button class="tool" data-tool="sticker"><span class="ic">😀</span><span class="lb">Obje</span></button>
  <button class="tool needsel" data-tool="pip"><span class="ic">🖼️</span><span class="lb">Bindirme</span></button>

<script>
"use strict";
/* =========================================================

   Yeni: klip geçişleri, video/foto efektleri, animasyonlu
   metinler ve hareketli bindirme objeler (çıkartmalar).

const $ = s => document.querySelector(s);
const canvas = $("#canvas"), ctx = canvas.getContext("2d", { alpha: false });

/* en-boy oranları (oran olarak; gerçek boyut çözünürlük seçimiyle hesaplanır) */

const EFFECTS = {

  vhs:      { name: "VHS",            icon: "📼", cat: "retro",    grad: "repeating-linear-gradient(0deg,#0e7490 0 4px,#155e75 4px 8px)" },
  hearts:   { name: "Kalpler",        icon: "💖", cat: "atmosfer", grad: "linear-gradient(135deg,#831843,#f472b6)" },

const FX_CATS = { all: "Tümü", trend: "Trend", atmosfer: "Atmosfer", retro: "Retro", hareket: "Hareket" };

const TRANSITIONS = {

  fade:   "Solma",
  black:  "Siyah",
  white:  "Beyaz",
  slideL: "Sola Kay",
  slideR: "Sağa Kay",
  slideU: "Yukarı Kay",

  zoom:   "Yakınlaş",
};

const ANIM_IN = {
  none: "Yok", fade: "Solma", pop: "Pop", slideUp: "Yukarı",
  slideDown: "Aşağı", fromLeft: "Soldan", fromRight: "Sağdan",
  bounce: "Zıpla", spin: "Dön", typewriter: "Daktilo",
};
const ANIM_LOOP = {
  none: "Yok", pulse: "Nabız", float: "Süzül", shake: "Titre",
  spin: "Dön", wave: "Dalga", rainbow: "Gökkuşağı",
};
const TEXT_ONLY_ANIMS = ["typewriter", "wave", "rainbow"];

const TEXT_COLORS = ["#ffffff","#0b0b0f","#f43f5e","#f59e0b","#22c55e","#3b82f6","#a855f7","#2dd4bf"];
const EMOJIS = ["😂","😍","🔥","❤️","👍","🎉","✨","⭐","💯","😎","🥳","😭","💪","👏","🙏","🤣","😜","🤩","💖","🌟","⚡","🎵","🏆","👑"];

const state = {
  clips: [],       // {id,type,url,name,el,natDur,in,out,speed,volume,filter,adjust,effect,trans,thumb}
  overlays: [],    // {id,kind:'text'|'sticker'|'pip',content,start,dur,x,y,size,color,bg,animIn,loop}
  musics: [],      // {id,mediaId,name,url,el,natDur,start,in,out,speed,volume} — bölünebilir müzik parçaları
  aspect: "9:16",
  t: 0,
  playing: false,
  pps: 56,         // piksel / saniye
  selClip: null,
  selOv: null,
  projectId: null,
  projectName: "",
  resolution: 720,   // kısa kenar (480/720/1080)
  fps: 30,
  exportW: 720,
  exportH: 1280,
  rendering: false,
};
let idSeq = 1;
/* çizim yalnızca gerektiğinde: oynatmıyorken kareyi tekrar tekrar boyama */
let needDraw = true;
const invalidate = () => { needDraw = true; };
let pendingTool = null;   // ana ekran kısayolundan gelinince açılacak panel
let lastSavedJson = "";

/* ---------- IndexedDB (proje + medya kalıcılığı) ---------- */
let _db = null;
function idb() {
  return new Promise((res, rej) => {
    if (_db) return res(_db);
    const r = indexedDB.open("pisancut", 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore("projects", { keyPath: "id" });
      r.result.createObjectStore("media", { keyPath: "id" });
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
const idbPut = (store, val) => idb().then(d => new Promise((res, rej) => {
  const tx = d.transaction(store, "readwrite");
  tx.objectStore(store).put(val);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
const idbGet = (store, key) => idb().then(d => new Promise((res, rej) => {
  const rq = d.transaction(store).objectStore(store).get(key);
  rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
}));
const idbAll = store => idb().then(d => new Promise((res, rej) => {
  const rq = d.transaction(store).objectStore(store).getAll();
  rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error);
}));
const idbDel = (store, key) => idb().then(d => new Promise((res, rej) => {
  const tx = d.transaction(store, "readwrite");
  tx.objectStore(store).delete(key);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "m" + Date.now() + Math.random().toString(36).slice(2));

/* ---------- Geri al / Yinele ----------
   Anlık görüntüler medya elemanlarını (el/url/thumb) referansla paylaşır;
   yalnızca alanlar kopyalanır. Her mutasyondan ÖNCE pushHistory çağrılır. */
const hist = { undo: [], redo: [] };
function snapState() {
  return {
    clips: state.clips.map(c => ({ ...c, adjust: { ...c.adjust }, trans: { ...c.trans } })),
    overlays: state.overlays.map(o => ({ ...o })),
    musics: state.musics.map(m => ({ ...m })),
    aspect: state.aspect, resolution: state.resolution, fps: state.fps,
  };
}
function stateJson() { try { return JSON.stringify(projectData()); } catch (_) { return String(Math.random()); } }
function pushHistory() {
  const json = stateJson();
  if (hist.undo.length && hist.undo[hist.undo.length - 1].json === json) return;
  hist.undo.push({ json, snap: snapState() });
  if (hist.undo.length > 50) hist.undo.shift();
  hist.redo.length = 0;
  updateUndoBtns();
}
function applySnap(s) {
  pause();
  state.clips = s.clips.map(c => ({ ...c, adjust: { ...c.adjust }, trans: { ...c.trans } }));
  state.overlays = s.overlays.map(o => ({ ...o }));
  state.musics = s.musics.map(m => ({ ...m }));
  state.selClip = null; state.selOv = null;
  const aspectChanged = state.aspect !== s.aspect || state.resolution !== s.resolution;
  state.aspect = s.aspect; state.resolution = s.resolution; state.fps = s.fps;
  if (aspectChanged) applyAspect();
  $("#emptyState").style.display = state.clips.length ? "none" : "flex";
  $("#btnExport").disabled = !state.clips.length;
  renderAll();
  seekTo(Math.min(state.t, totalDur()), true);
}
function doUndo() {
  if (!hist.undo.length) return;
  const cur = { json: stateJson(), snap: snapState() };
  let top = hist.undo.pop();
  while (top && top.json === cur.json && hist.undo.length) top = hist.undo.pop();
  if (!top || top.json === cur.json) { updateUndoBtns(); return; }
  hist.redo.push(cur);
  applySnap(top.snap);
  updateUndoBtns();
  toast("Geri alındı");
}
function doRedo() {
  if (!hist.redo.length) return;
  hist.undo.push({ json: stateJson(), snap: snapState() });
  const nxt = hist.redo.pop();
  applySnap(nxt.snap);
  updateUndoBtns();
  toast("Yinelendi");
}
function updateUndoBtns() {
  $("#btnUndo").disabled = !hist.undo.length;
  $("#btnRedo").disabled = !hist.redo.length;
}
function clearHistory() { hist.undo.length = 0; hist.redo.length = 0; updateUndoBtns(); }

window.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const tag = (e.target.tagName || "").toUpperCase();
  if (tag === "INPUT" || tag === "TEXTAREA") return;   // metin alanlarında kes/yapıştır bozulmasın
  const k = e.key.toLowerCase();
  if (k === "z" && e.shiftKey) { e.preventDefault(); doRedo(); }
  else if (k === "z") { e.preventDefault(); doUndo(); }
  else if (k === "x" || k === "y") { e.preventDefault(); doRedo(); }
});

/* ---------- yardımcılar ---------- */
const clipDur = c => (c.out - c.in) / c.speed;
const clipsDur = () => state.clips.reduce((a, c) => a + clipDur(c), 0);
const musicDur = m => (m.out - m.in) / m.speed;
/* proje süresi: müzik kliplerden uzunsa video son karede donarak müziğin sonuna kadar uzar */
const totalDur = () => Math.max(clipsDur(), ...state.musics.map(m => m.start + musicDur(m)), 0);
/* Seçili klip yoksa oynatma çubuğunun altındaki klibi hedefle */
const targetClip = () => state.selClip || (locate(state.t) || {}).clip || null;
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
/* deterministik sözde-rastgele (efektler her karede aynı tohumla çizilir) */
const n1 = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function bounceOut(p) {
  const n = 7.5625, d = 2.75;
  if (p < 1 / d) return n * p * p;
  if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
  if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375;
  return n * (p -= 2.625 / d) * p + .984375;
}

function clipStart(c) {
  let t = 0;
  for (const k of state.clips) { if (k === c) return t; t += clipDur(k); }
  return t;
}
function locate(t) {
  let acc = 0;
  for (const c of state.clips) {
    const d = clipDur(c);
    if (t < acc + d || c === state.clips[state.clips.length - 1]) {
      return { clip: c, offset: clamp(t - acc, 0, d) };
    }
    acc += d;
  }
  return null;
}
function fmt(t) {
  t = Math.max(0, t);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), d = Math.floor((t % 1) * 10);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${d}`;
}
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 1800);
}

/* ---------- medya ekleme ---------- */
$("#btnEmptyAdd").onclick = () => $("#fileVideo").click();
$("#fileVideo").onchange = async e => {
  const files = [...e.target.files];
  if (files.length) pushHistory();
  e.target.value = "";
  for (const f of files) await addMedia(f);
  if (state.clips.length) {
    $("#emptyState").style.display = "none";
    $("#btnExport").disabled = false;
  }
  renderAll();
  seekTo(state.t, true);
  if (pendingTool && state.clips.length) {
    const t = pendingTool;
    pendingTool = null;
    setTimeout(() => handleTool(t), 250);
  }
};

function addMedia(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const mediaId = uid();
    idbPut("media", { id: mediaId, blob: file, name: file.name, type: file.type }).catch(() => {});
    if (file.type.startsWith("image/")) {
      const img = new Image();
      img.onload = () => {
        const c = mkClip("image", url, file.name, img, 3);
        c.mediaId = mediaId;
        c.thumb = makeThumb(img, img.naturalWidth, img.naturalHeight);
        state.clips.push(c);
        resolve();
      };
      img.onerror = () => { toast("Görsel açılamadı: " + file.name); resolve(); };
      img.src = url;
    } else {
      const v = document.createElement("video");
      v.src = url;
      v.preload = "auto";
      v.playsInline = true; v.setAttribute("playsinline", "");
      v.crossOrigin = "anonymous";
      v.addEventListener("seeked", invalidate);   // sarma bitince kareyi tazele
      v.onloadedmetadata = async () => {
        v.onloadedmetadata = null;
        const dur = await resolveDuration(v);
        const c = mkClip("video", url, file.name, v, dur);
        c.mediaId = mediaId;
        state.clips.push(c);
        grabThumb(c);
        resolve();
      };
      v.onerror = () => { toast("Video açılamadı: " + file.name); resolve(); };
    }
  });
}

/* MediaRecorder çıktısı WebM'lerde duration=Infinity gelir (Chrome);
   sona sarıp gerçek süreyi okuyoruz. */
function resolveDuration(v) {
  if (isFinite(v.duration) && v.duration > 0) return Promise.resolve(v.duration);
  return new Promise(res => {
    const finish = d => {
      v.removeEventListener("durationchange", onDur);
      clearTimeout(to);
      try { v.currentTime = 0; } catch (_) {}
      res(d);
    };
    const onDur = () => { if (isFinite(v.duration) && v.duration > 0) finish(v.duration); };
    const to = setTimeout(() => finish(isFinite(v.duration) && v.duration > 0 ? v.duration : 1), 3000);
    v.addEventListener("durationchange", onDur);
    try { v.currentTime = 1e7; } catch (_) { finish(1); }
  });
}

function mkClip(type, url, name, el, natDur) {
  return {
    id: idSeq++, type, url, name, el,
    natDur, in: 0, out: natDur,
    speed: 1, volume: 1, filter: "none",
    pitchShift: false,           // true: hız değişince ses perdesi de değişsin
    tx: 0, ty: 0, scale: 1,      // önizlemede parmakla taşıma / yakınlaştırma
    adjust: { b: 1, c: 1, s: 1 },
    effect: "none",
    trans: { type: "none", dur: .6 },  // bu klipten SONRAKİNE geçiş
    thumb: null,
  };
}

function makeThumb(source, w, h) {
  const tw = 72, th = 52;
  const tc = document.createElement("canvas");
  tc.width = tw; tc.height = th;
  const tctx = tc.getContext("2d");
  const scale = Math.max(tw / w, th / h);
  tctx.drawImage(source, (tw - w * scale) / 2, (th - h * scale) / 2, w * scale, h * scale);
  return tc.toDataURL("image/jpeg", .6);
}

function grabThumb(clip) {
  const v = clip.el;
  const cap = () => {
    try {
      clip.thumb = makeThumb(v, v.videoWidth, v.videoHeight);
      renderTimeline();
    } catch (_) {}
  };
  const once = () => { cap(); v.removeEventListener("seeked", once); };
  v.addEventListener("seeked", once);
  try { v.currentTime = Math.min(.1, clip.natDur / 2); } catch (_) { cap(); }
}

/* ---------- çizim ---------- */
function buildFilter(c) {
  const a = c.adjust;
  let f = FILTERS[c.filter]?.css || "";
  /* ctx.filter pahalı: ayar varsayılandaysa hiç filtre uygulama */
  if (a.b !== 1 || a.c !== 1 || a.s !== 1) {
    f += ` brightness(${a.b}) contrast(${a.c}) saturate(${a.s})`;
  }
  return f.trim();
}

/* klibin karesini kapla-sığdır + dönüşüm/saydamlık/kırpma ile çiz */
function drawClipImage(c, o = {}) {
  const W = canvas.width, H = canvas.height;
  const src = c.el;
  const sw = c.type === "image" ? src.naturalWidth : src.videoWidth;
  const sh = c.type === "image" ? src.naturalHeight : src.videoHeight;
  if (!sw || !sh) return;
  const fit = Math.min(W / sw, H / sh);
  const dw = sw * fit, dh = sh * fit;
  ctx.save();
  if (o.clipRect) { ctx.beginPath(); ctx.rect(...o.clipRect); ctx.clip(); }
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.translate(W / 2 + (o.tx || 0), H / 2 + (o.ty || 0));
  const s = o.scale || 1;
  ctx.scale(s, s);
  const f = buildFilter(c);
  if (f) ctx.filter = f;
  ctx.drawImage(src, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
  if (f) ctx.filter = "none";
}

/* çözünürlükten bağımsız efekt ölçeği (önizleme küçük canvas'ta çalışır) */
const fxScale = () => Math.min(canvas.width, canvas.height) / 720;

/* efektin klip çizimine uyguladığı dönüşüm (sarsıntı, nabız, ken burns) */
function effectTransform(c, into) {
  const W = canvas.width, k = fxScale();
  switch (c.effect) {
    case "shake": {
      const f = Math.floor(state.t * 18);
      return { tx: (n1(f) - .5) * 16 * k, ty: (n1(f + 31) - .5) * 16 * k, scale: 1.03 };
    }
    case "pulse":
      return { scale: 1 + .045 * Math.sin(state.t * Math.PI * 2 * 1.3) };
    case "kenburns": {
      const pr = clamp(into / Math.max(clipDur(c), .01), 0, 1);
      const dir = c.id % 2 ? 1 : -1;
      return { scale: 1.06 + .22 * pr, tx: dir * (pr - .5) * .05 * W };
    }
  }
  return {};
}

/* klip üstüne çizilen efekt katmanları */
function drawEffectOverlay(c) {
  const W = canvas.width, H = canvas.height, t = state.t, k = fxScale();
  switch (c.effect) {
    case "vignette": {
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .72);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(1, "rgba(0,0,0,.6)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      break;
    }
    case "grain":
      drawNoise(.12);
      break;
    case "vhs": {
      drawNoise(.06);
      ctx.fillStyle = "rgba(0,0,0,.14)";
      const step = Math.max(4 * k, 2);
      for (let y = 0; y < H; y += step) ctx.fillRect(0, y, W, 1.4 * k);
      const bh = 80 * k;
      const by = (t * 90 * k) % (H + bh * 2) - bh;
      const g = ctx.createLinearGradient(0, by, 0, by + bh);
      g.addColorStop(0, "rgba(255,255,255,0)");
      g.addColorStop(.5, "rgba(255,255,255,.07)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, by, W, bh);
      ctx.fillStyle = "rgba(0,255,230,.03)";
      ctx.fillRect(0, 0, W, H);
      break;
    }
    case "glitch": {
      const burst = n1(Math.floor(t * 1.7));
      if (burst > .42) {
        const k = 3 + Math.floor(n1(Math.floor(t * 9)) * 4);
        for (let i = 0; i < k; i++) {
          const seed = Math.floor(t * 12) * 10 + i;
          const sy = n1(seed) * H;
          const sh = (8 + n1(seed + 1) * 46) * k;
          const dx = (n1(seed + 2) - .5) * 60 * k;
          try { ctx.drawImage(canvas, 0, sy, W, sh, dx, sy, W, sh); } catch (_) {}
          ctx.fillStyle = i % 2 ? "rgba(255,0,80,.08)" : "rgba(0,255,255,.08)";
          ctx.fillRect(0, sy, W, sh);
        }
      }
      break;
    }
    case "snow":
      for (let i = 0; i < 55; i++) {
        const sp = (26 + n1(i + 7) * 55) * k;
        const x = (n1(i) * W + Math.sin(t * .8 + i) * 26 * k + W) % W;
        const y = (n1(i + 99) * H + t * sp) % H;
        ctx.globalAlpha = .55 + n1(i + 3) * .4;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(x, y, (1.2 + n1(i + 5) * 2.4) * k, 0, 7);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      break;
    case "rain":
      ctx.strokeStyle = "rgba(180,210,255,.4)";
      ctx.lineWidth = 1.4 * k;
      for (let i = 0; i < 70; i++) {
        const sp = (380 + n1(i + 9) * 260) * k;
        const x = (n1(i) * W + t * 60 * k) % W;
        const y = (n1(i + 50) * H + t * sp) % H;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 3 * k, y + 15 * k);
        ctx.stroke();
      }
      break;
    case "sparkle":
      for (let i = 0; i < 26; i++) {
        const tw = (Math.sin(t * 3.2 + i * 2.1) + 1) / 2;
        if (tw < .25) continue;
        const x = n1(i) * W, y = n1(i + 31) * H;
        const r = (1.5 + n1(i + 13) * 3.5) * tw * k;
        ctx.globalAlpha = tw * .95;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.4 * k;
        ctx.beginPath();
        ctx.moveTo(x - r * 2, y); ctx.lineTo(x + r * 2, y);
        ctx.moveTo(x, y - r * 2); ctx.lineTo(x, y + r * 2);
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(x, y, r * .55, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
      break;
    case "negative":
      ctx.save();
      ctx.globalCompositeOperation = "difference";
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      break;
    case "hearts":
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let i = 0; i < 16; i++) {
        const sp = (30 + n1(i + 11) * 50) * k;
        const x = (n1(i) * W + Math.sin(t * 1.2 + i) * 30 * k + W) % W;
        const y = H - ((n1(i + 77) * H + t * sp) % H);
        ctx.globalAlpha = .5 + n1(i + 5) * .5;
        ctx.font = ((14 + n1(i + 3) * 22) * k) + "px sans-serif";
        ctx.fillText("💖", x, y);
      }
      ctx.globalAlpha = 1;
      break;
    case "confetti":
      for (let i = 0; i < 40; i++) {
        const sp = (120 + n1(i + 9) * 180) * k;
        const x = (n1(i) * W + Math.sin(t * 2 + i) * 24 * k + W) % W;
        const y = (n1(i + 50) * H + t * sp) % H;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * (2 + n1(i + 4) * 4) + i);
        ctx.fillStyle = `hsl(${(n1(i + 21) * 360) | 0} 90% 60%)`;
        ctx.fillRect(-4 * k, -2.5 * k, 8 * k, 5 * k);
        ctx.restore();
      }
      break;
  }
}

let noisePat = null;
function drawNoise(alpha) {
  if (!noisePat) {
    const nc = document.createElement("canvas");
    nc.width = nc.height = 160;
    const nx = nc.getContext("2d");
    const d = nx.createImageData(160, 160);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = Math.random() * 255;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
      d.data[i + 3] = 255;
    }
    nx.putImageData(d, 0, 0);
    noisePat = ctx.createPattern(nc, "repeat");
  }
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(-Math.random() * 160, -Math.random() * 160);
  ctx.fillStyle = noisePat;
  ctx.fillRect(0, 0, canvas.width + 160, canvas.height + 160);
  ctx.restore();
}

/* önceki klipten aktif klibe geçiş: p 0→1 (önceki ayrılıyor) */
function drawTransition(prev, type, p) {
  const W = canvas.width, H = canvas.height;
  const e = easeInOut(p);
  const bx = (prev.tx || 0) * W, by = (prev.ty || 0) * H, bs = prev.scale || 1;
  switch (type) {
    case "fade":   drawClipImage(prev, { alpha: 1 - e, tx: bx, ty: by, scale: bs }); break;
    case "black":
    case "white":
      ctx.save();
      ctx.globalAlpha = 1 - e;
      ctx.fillStyle = type === "black" ? "#000" : "#fff";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      break;
    case "slideL": drawClipImage(prev, { tx: bx - e * W, ty: by, scale: bs }); break;
    case "slideR": drawClipImage(prev, { tx: bx + e * W, ty: by, scale: bs }); break;
    case "slideU": drawClipImage(prev, { tx: bx, ty: by - e * H, scale: bs }); break;
    case "wipe":   drawClipImage(prev, { clipRect: [e * W, 0, W * (1 - e), H], tx: bx, ty: by, scale: bs }); break;
    case "zoom":   drawClipImage(prev, { alpha: 1 - e, scale: bs * (1 + e * 1.3), tx: bx, ty: by }); break;
  }
}

/* ---------- bindirme animasyonları ---------- */
function animState(o) {
  const local = state.t - o.start;
  const inDur = Math.min(.55, o.dur * .35);
  const outDur = Math.min(.3, o.dur * .2);
  let alpha = 1, dx = 0, dy = 0, sc = 1, rot = 0;
  if (o.animIn && o.animIn !== "none" && o.animIn !== "typewriter") {
    const p = clamp(local / inDur, 0, 1);
    const ep = easeOut(p), q = 1 - ep;
    switch (o.animIn) {
      case "fade":      alpha = ep; break;
      case "pop":       alpha = Math.min(p * 2.5, 1); sc = .2 + .8 * ep + .16 * Math.sin(Math.PI * ep); break;
      case "slideUp":   alpha = ep; dy = q * .22; break;
      case "slideDown": alpha = ep; dy = -q * .22; break;
      case "fromRight": alpha = ep; dx = q * .45; break;
      case "fromLeft":  alpha = ep; dx = -q * .45; break;
      case "bounce":    alpha = Math.min(p * 3, 1); dy = -(1 - bounceOut(p)) * .35; break;
      case "spin":      alpha = ep; rot = q * Math.PI * 2; sc = Math.max(ep, .05); break;
    }
    const rem = o.start + o.dur - state.t;
    if (rem < outDur) alpha *= clamp(rem / outDur, 0, 1);
  }
  switch (o.loop) {
    case "pulse": sc *= 1 + .07 * Math.sin(state.t * 5 + o.id); break;
    case "float": dy += .015 * Math.sin(state.t * 2.4 + o.id); break;
    case "shake": {
      const f = Math.floor(state.t * 22);
      dx += (n1(f + o.id) - .5) * .02;
      dy += (n1(f + o.id + 7) - .5) * .02;
      break;
    }
    case "spin": rot += state.t * 2.4; break;
  }
  return { alpha, dx, dy, sc, rot, local };
}

function drawOverlayItem(o) {
  if (state.t < o.start || state.t > o.start + o.dur) return;
  const W = canvas.width, H = canvas.height;
  const st = animState(o);
  if (st.alpha <= 0.01) return;
  const px = o.size * H;
  ctx.save();
  ctx.globalAlpha = st.alpha;
  ctx.translate(o.x * W + st.dx * W, o.y * H + st.dy * H);
  ctx.rotate(st.rot);
  ctx.scale(st.sc, st.sc);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `700 ${px}px -apple-system, "Segoe UI", Roboto, sans-serif`;

  if (o.kind === "pip") {
    const src = o.el;
    const sw = o.type === "image" ? src.naturalWidth : src.videoWidth;
    const sh = o.type === "image" ? src.naturalHeight : src.videoHeight;
    if (sw && sh) {
      const dw = o.scale * W, dh = dw * sh / sw;
      ctx.drawImage(src, -dw / 2, -dh / 2, dw, dh);
      if (o === state.selOv) {
        ctx.strokeStyle = "#2dd4bf"; ctx.lineWidth = 2 / st.sc; ctx.setLineDash([6, 5]);
        ctx.strokeRect(-dw / 2 - 4, -dh / 2 - 4, dw + 8, dh + 8);
        ctx.setLineDash([]);
      }
    }
    ctx.restore();
    return;
  }

  if (o.kind === "sticker") {
    ctx.fillText(o.content, 0, 0);
  } else {
    let lines = o.content.split("\n");
    /* daktilo: karakterleri süreyle aç */
    if (o.animIn === "typewriter") {
      const totalCh = o.content.replace(/\n/g, "").length;
      const typeDur = Math.min(1.4, o.dur * .45);
      let shown = Math.ceil(totalCh * clamp(st.local / typeDur, 0, 1));
      lines = lines.map(ln => {
        const take = clamp(shown, 0, ln.length);
        shown -= ln.length;
        return ln.slice(0, take);
      });
    }
    let charIdx = 0;
    lines.forEach((ln, i) => {
      const ly = (i - (lines.length - 1) / 2) * px * 1.2;
      if (o.bg && ln.length) {
        const m = ctx.measureText(ln);
        ctx.fillStyle = "rgba(0,0,0,.55)";
        const pad = px * .3;
        roundRect(-m.width / 2 - pad, ly - px / 2 - pad * .4, m.width + pad * 2, px + pad * .8, px * .25);
      }
      ctx.strokeStyle = "rgba(0,0,0,.4)";
      ctx.lineWidth = px * .06;
      if (o.loop === "wave" || o.loop === "rainbow") {
        /* karakter karakter: dalga / gökkuşağı */
        const widths = [...ln].map(ch => ctx.measureText(ch).width);
        const total = widths.reduce((a, b) => a + b, 0);
        let cx = -total / 2;
        [...ln].forEach((ch, k) => {
          const ccx = cx + widths[k] / 2;
          const cdy = o.loop === "wave" ? Math.sin(state.t * 5 + charIdx * .55) * px * .16 : 0;
          ctx.fillStyle = o.loop === "rainbow"
            ? `hsl(${(state.t * 110 + charIdx * 26) % 360} 90% 62%)`
            : o.color;
          ctx.strokeText(ch, ccx, ly + cdy);
          ctx.fillText(ch, ccx, ly + cdy);
          cx += widths[k];
          charIdx++;
        });
      } else {
        ctx.fillStyle = o.color;
        ctx.strokeText(ln, 0, ly);
        ctx.fillText(ln, 0, ly);
      }
    });
  }

  if (o === state.selOv) {
    ctx.strokeStyle = "#2dd4bf"; ctx.lineWidth = 2 / st.sc; ctx.setLineDash([6, 5]);
    const bw = o.kind === "sticker" ? px * 1.3 : Math.max(...o.content.split("\n").map(l => ctx.measureText(l).width), px) + px * .6;
    const bh = o.kind === "sticker" ? px * 1.3 : o.content.split("\n").length * px * 1.2 + px * .4;
    ctx.strokeRect(-bw / 2, -bh / 2, bw, bh);
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.fill();
}

function drawFrame() {
  const W = canvas.width, H = canvas.height;
  ctx.filter = "none";
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  const loc = locate(state.t);
  if (loc) {
    const c = loc.clip;
    const idx = state.clips.indexOf(c);
    const into = state.t - clipStart(c);
    const et = effectTransform(c, into);
    drawClipImage(c, {
      tx: (et.tx || 0) + (c.tx || 0) * W,
      ty: (et.ty || 0) + (c.ty || 0) * H,
      scale: (et.scale || 1) * (c.scale || 1),
    });
    /* önceki klipten geçiş: sınırdan sonra tr.dur boyunca */
    const prev = idx > 0 ? state.clips[idx - 1] : null;
    if (prev && prev.trans && prev.trans.type !== "none" && into < prev.trans.dur) {
      drawTransition(prev, prev.trans.type, clamp(into / prev.trans.dur, 0, 1));
    }
    drawEffectOverlay(c);
  }
  for (const o of state.overlays) drawOverlayItem(o);
  /* sürüklerken merkez kılavuz çizgileri */
  if (!state.rendering && gesture.target && (gesture.snapX || gesture.snapY)) {
    ctx.strokeStyle = "rgba(45,212,191,.9)";
    ctx.lineWidth = Math.max(1.5, fxScale() * 1.5);
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    if (gesture.snapX) { ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); }
    if (gesture.snapY) { ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); }
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

/* ---------- oynatma motoru ---------- */
let lastTick = 0, lastLabel = "";
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - lastTick) / 1000, .1);
  lastTick = now;
  if (state.rendering) return;   // offline render kendi döngüsünü kullanır
  if (state.playing) {
    state.t += dt;
    if (state.t >= totalDur()) {
      state.t = totalDur();
      pause();
    }
    syncMedia();
    scrollToTime(true);
  }
  if (state.playing || needDraw) {
    drawFrame();
    needDraw = false;
  }
  const label = fmt(state.t) + " / " + fmt(totalDur());
  if (label !== lastLabel) { lastLabel = label; $("#timeLabel").textContent = label; }
}
requestAnimationFrame(t => { lastTick = t; tick(t); });

function syncMedia() {
  const loc = locate(state.t);
  /* müzik videodan uzunsa: klipler bitti, son kare donuk kalır */
  const beyondClips = state.t >= clipsDur() - .02;
  for (const c of state.clips) {
    if (c.type !== "video") continue;
    const v = c.el;
    if (loc && c === loc.clip && state.playing && !beyondClips) {
      const target = c.in + loc.offset * c.speed;
      /* tarayıcı sınırları dışındaki hızlarda sürüklenme sık sarma ile düzeltilir */
      v.playbackRate = clamp(c.speed, .0625, 16);
      if ("preservesPitch" in v) v.preservesPitch = !c.pitchShift;
      else if ("webkitPreservesPitch" in v) v.webkitPreservesPitch = !c.pitchShift;
      v.volume = clamp(c.volume, 0, 1);
      v.muted = c.volume === 0;
      if (Math.abs(v.currentTime - target) > .25) v.currentTime = target;
      if (v.paused) v.play().catch(() => {});
    } else if (!v.paused) v.pause();
  }
  /* bindirme (PiP) videoları */
  for (const o of state.overlays) {
    if (o.kind !== "pip" || o.type !== "video") continue;
    const v = o.el;
    if (state.playing && state.t >= o.start && state.t < o.start + o.dur) {
      const target = o.in + (state.t - o.start);
      v.playbackRate = 1;
      v.volume = clamp(o.volume, 0, 1);
      v.muted = o.volume === 0;
      if (Math.abs(v.currentTime - target) > .25) v.currentTime = target;
      if (v.paused) v.play().catch(() => {});
    } else if (!v.paused) v.pause();
  }
  for (const m of state.musics) {
    const active = state.playing && state.t >= m.start && state.t < m.start + musicDur(m);
    if (active) {
      const target = m.in + (state.t - m.start) * m.speed;
      m.el.playbackRate = clamp(m.speed, .0625, 16);
      m.el.volume = clamp(m.volume, 0, 1);
      if (Math.abs(m.el.currentTime - target) > .3) m.el.currentTime = target;
      if (m.el.paused) m.el.play().catch(() => {});
    } else if (!m.el.paused) m.el.pause();
  }
}

function play() {
  if (!state.clips.length) return;
  if (state.t >= totalDur() - .05) state.t = 0;
  state.playing = true;
  $("#btnPlay").textContent = "⏸";
  syncMedia();
}
function pause() {
  state.playing = false;
  $("#btnPlay").textContent = "▶";
  for (const c of state.clips) if (c.type === "video" && !c.el.paused) c.el.pause();
  for (const o of state.overlays) if (o.kind === "pip" && o.type === "video" && !o.el.paused) o.el.pause();
  for (const m of state.musics) if (!m.el.paused) m.el.pause();
}
$("#btnPlay").onclick = () => state.playing ? pause() : play();
$("#btnUndo").onclick = doUndo;
$("#btnRedo").onclick = doRedo;

function openOverlaySheet(o) {
  if (o.kind === "text") openTextSheet(o);
  else if (o.kind === "sticker") openStickerEditSheet(o);
  else openPipSheet(o);
}

function handleTap(e) {
  const hit = pickOverlay(e);
  if (hit) {
    if (state.selOv === hit) openOverlaySheet(hit);
    else { state.selOv = hit; renderTimeline(); }
    return;
  }
  if (state.selOv) { state.selOv = null; renderTimeline(); return; }
  state.playing ? pause() : play();
  const ov = $("#playOverlay");
  ov.classList.add("show");
  ov.querySelector(".ring").textContent = state.playing ? "⏸" : "▶";
  setTimeout(() => ov.classList.remove("show"), 500);
}

function seekTo(t, force) {
  state.t = clamp(t, 0, totalDur());
  const loc = locate(state.t);
  if (loc && loc.clip.type === "video") {
    const target = loc.clip.in + loc.offset * loc.clip.speed;
    const v = loc.clip.el;
    if (force || Math.abs(v.currentTime - target) > .05) {
      try { v.currentTime = target; } catch (_) {}
    }
  }
  prepTransitionFrame();
  seekPips();
  scrollToTime(true);
  invalidate();
}

/* sarma sırasında aktif bindirme videolarını da doğru kareye getir */
function seekPips() {
  for (const o of state.overlays) {
    if (o.kind !== "pip" || o.type !== "video") continue;
    if (state.t < o.start || state.t > o.start + o.dur) continue;
    const target = o.in + (state.t - o.start);
    if (Math.abs(o.el.currentTime - target) > .1) {
      try { o.el.currentTime = target; } catch (_) {}
    }
  }
}

/* Geçiş penceresi içindeysek önceki klibin karesini son konumuna sar
   (kaydırarak gelindiğinde doğru kare görünsün) */
function prepTransitionFrame() {
  const loc = locate(state.t);
  if (!loc) return;
  const idx = state.clips.indexOf(loc.clip);
  const prev = idx > 0 ? state.clips[idx - 1] : null;
  if (!prev || !prev.trans || prev.trans.type === "none") return;
  const into = state.t - clipStart(loc.clip);
  if (into >= prev.trans.dur || prev.type !== "video") return;
  const end = Math.max(prev.out - .05, prev.in);
  if (Math.abs(prev.el.currentTime - end) > .2) {
    try { prev.el.currentTime = end; } catch (_) {}
  }
}

/* ---------- zaman çizelgesi ---------- */
const tlScroll = $("#tlScroll");
let tlPad = 0, ignoreScroll = false;

function scrollToTime(setting) {
  ignoreScroll = !!setting;
  tlScroll.scrollLeft = state.t * state.pps;
  requestAnimationFrame(() => ignoreScroll = false);
}
/* Oynatma sırasında scrollLeft'i biz güncellediğimiz için scroll olayı
   gecikmeli gelebilir; bu yüzden sarma yalnızca kullanıcı dokununca duraklatır. */
tlScroll.addEventListener("pointerdown", () => { if (state.playing) pause(); });
tlScroll.addEventListener("touchstart", () => { if (state.playing) pause(); }, { passive: true });
tlScroll.addEventListener("wheel", () => { if (state.playing) pause(); }, { passive: true });
tlScroll.addEventListener("scroll", () => {
  if (ignoreScroll || state.playing) return;
  state.t = clamp(tlScroll.scrollLeft / state.pps, 0, totalDur());
  const loc = locate(state.t);
  if (loc && loc.clip.type === "video") {
    const v = loc.clip.el;
    const target = loc.clip.in + loc.offset * loc.clip.speed;
    if (Math.abs(v.currentTime - target) > .08) {
      try { v.currentTime = target; } catch (_) {}
    }
  }
  prepTransitionFrame();
  invalidate();
});

function renderTimeline() {
  invalidate();
  tlPad = tlScroll.clientWidth / 2;
  const content = $("#tlContent");
  content.style.paddingLeft = tlPad + "px";
  content.style.paddingRight = tlPad + "px";

  // cetvel
  const ruler = $("#ruler");
  ruler.innerHTML = "";
  const rawTotal = totalDur();
  const total = Math.min(Math.max(isFinite(rawTotal) ? rawTotal : 1, 1), 7200);
  ruler.style.width = total * state.pps + "px";
  const step = state.pps >= 90 ? 1 : state.pps >= 40 ? 2 : 5;
  for (let s = 0; s <= Math.ceil(total); s += step) {
    const el = document.createElement("span");
    el.className = "tick";
    el.style.left = s * state.pps + "px";
    el.textContent = s + "s";
    ruler.appendChild(el);
  }

  // bindirme şeridi (metin + obje)
  const tt = $("#textTrack");
  tt.innerHTML = "";
  tt.style.width = total * state.pps + "px";
  for (const o of state.overlays) {
    const b = document.createElement("div");
    b.className = "textBar" +
      (o.kind === "sticker" ? " stk" : o.kind === "pip" ? " pip" : "") +
      (o === state.selOv ? " sel" : "");
    b.style.left = o.start * state.pps + "px";
    b.style.width = Math.max(o.dur * state.pps, 18) + "px";
    b.textContent = o.content.replace(/\n/g, " ");
    bindOverlayBar(b, o);
    tt.appendChild(b);
  }

  // klip şeridi
  const track = $("#clipTrack");
  track.innerHTML = "";
  let accW = 0;
  state.clips.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "clip" + (c === state.selClip ? " sel" : "");
    const w = Math.max(clipDur(c) * state.pps, 24);
    d.style.width = w + "px";
    if (c.thumb) d.style.backgroundImage = `url(${c.thumb})`;
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent =
      (c.effect !== "none" ? "✨ " : "") +
      (c.speed !== 1 ? c.speed + "x · " : "") + clipDur(c).toFixed(1) + "s";
    d.appendChild(badge);

    const hl = document.createElement("div"); hl.className = "handle l";
    const hr = document.createElement("div"); hr.className = "handle r";
    d.appendChild(hl); d.appendChild(hr);
    bindTrim(hl, c, "l"); bindTrim(hr, c, "r");

    d.addEventListener("click", ev => {
      if (ev.target.classList.contains("handle") || ev.target.classList.contains("transBtn")) return;
      state.selClip = (state.selClip === c) ? null : c;
      state.selOv = null;
      renderTimeline();
    });
    track.appendChild(d);
    accW += w;

    // klip sınırındaki geçiş düğmesi
    if (i < state.clips.length - 1) {
      const on = c.trans && c.trans.type !== "none";
      const tb = document.createElement("button");
      tb.className = "transBtn" + (on ? " on" : "");
      tb.style.left = accW + "px";
      tb.textContent = on ? "⇄" : "|";
      tb.onclick = ev => { ev.stopPropagation(); openTransSheet(c); };
      track.appendChild(tb);
    }
  });
  const add = document.createElement("button");
  add.id = "addClipBtn"; add.textContent = "+";
  add.onclick = () => $("#fileVideo").click();
  track.appendChild(add);

  // müzik şeridi (bölünebilir segment çubukları)
  const mrow = $("#musicRow");
  mrow.innerHTML = "";
  mrow.style.width = total * state.pps + "px";
  for (const m of state.musics) {
    const b = document.createElement("div");
    b.className = "musicSeg";
    b.style.left = m.start * state.pps + "px";
    b.style.width = Math.max(musicDur(m) * state.pps, 18) + "px";
    b.textContent = "🎵 " + (m.speed !== 1 ? m.speed + "x · " : "") + m.name;
    bindMusicBar(b, m);
    mrow.appendChild(b);
  }

  $("#btnUndoDel").disabled = !state.clips.length;
  document.querySelectorAll(".tool.needsel").forEach(b =>
    b.classList.toggle("disabled", !state.clips.length));
}

function renderAll() { renderTimeline(); scrollToTime(true); }

/* zaman çizelgesi yeniden çizimini rAF'e sıkıştır (sürüklemede jank önler) */
let tlScheduled = false;
function scheduleTimeline() {
  if (tlScheduled) return;
  tlScheduled = true;
  requestAnimationFrame(() => { tlScheduled = false; renderTimeline(); });
}

/* bindirme çubuğu: ortadan sürükle=taşı, uçlardan sürükle=uzat/kısalt */
function bindOverlayBar(bar, o) {
  bar.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation();
    try { bar.setPointerCapture(e.pointerId); } catch (_) {}
    pushHistory();
    const barW = bar.offsetWidth;
    const offX = e.clientX - bar.getBoundingClientRect().left;
    const edge = Math.min(16, barW / 3);
    const mode = barW > 30 && offX < edge ? "l" : barW > 30 && offX > barW - edge ? "r" : "m";
    const startX = e.clientX;
    const orig = { start: o.start, dur: o.dur, in: o.in || 0 };
    const isVidPip = o.kind === "pip" && o.type === "video";
    const maxDur = isVidPip ? Math.max((o.natDur || 1e9) - orig.in, .3) : 120;
    let moved = false;
    const move = ev => {
      const dx = (ev.clientX - startX) / state.pps;
      if (!moved && Math.abs(ev.clientX - startX) < 4) return;
      moved = true;
      if (mode === "m") {
        o.start = Math.max(0, orig.start + dx);
      } else if (mode === "r") {
        o.dur = clamp(orig.dur + dx, .3, maxDur);
      } else {
        const minStart = isVidPip ? orig.start - orig.in : 0;
        const ns = clamp(orig.start + dx, Math.max(minStart, 0), orig.start + orig.dur - .3);
        const delta = ns - orig.start;
        o.start = ns;
        o.dur = orig.dur - delta;
        if (isVidPip) o.in = Math.max(orig.in + delta, 0);
      }
      bar.style.left = o.start * state.pps + "px";
      bar.style.width = Math.max(o.dur * state.pps, 18) + "px";
      invalidate();
    };
    const up = () => {
      bar.removeEventListener("pointermove", move);
      bar.removeEventListener("pointerup", up);
      if (moved) { renderTimeline(); return; }
      /* dokunma: seç / açıksa panelini aç */
      if (state.selOv === o) { openOverlaySheet(o); return; }
      state.selOv = o; state.selClip = null;
      renderTimeline();
    };
    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", up);
  });
}

/* müzik çubuğu: ortadan taşı, uçlardan kırp; dokun = düzenleme paneli */
function bindMusicBar(bar, m) {
  bar.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation();
    try { bar.setPointerCapture(e.pointerId); } catch (_) {}
    pushHistory();
    const barW = bar.offsetWidth;
    const offX = e.clientX - bar.getBoundingClientRect().left;
    const edge = Math.min(16, barW / 3);
    const mode = barW > 30 && offX < edge ? "l" : barW > 30 && offX > barW - edge ? "r" : "m";
    const startX = e.clientX;
    const orig = { start: m.start, in: m.in, out: m.out, durTl: musicDur(m) };
    let moved = false;
    const move = ev => {
      const dx = (ev.clientX - startX) / state.pps;
      if (!moved && Math.abs(ev.clientX - startX) < 4) return;
      moved = true;
      if (mode === "m") {
        m.start = Math.max(0, orig.start + dx);
      } else if (mode === "r") {
        const nd = clamp(orig.durTl + dx, .3, (m.natDur - m.in) / m.speed);
        m.out = m.in + nd * m.speed;
      } else {
        const ns = clamp(orig.start + dx, Math.max(0, orig.start - orig.in / m.speed), orig.start + orig.durTl - .3);
        const delta = ns - orig.start;
        m.start = ns;
        m.in = clamp(orig.in + delta * m.speed, 0, m.out - .05);
      }
      bar.style.left = m.start * state.pps + "px";
      bar.style.width = Math.max(musicDur(m) * state.pps, 18) + "px";
    };
    const up = () => {
      bar.removeEventListener("pointermove", move);
      bar.removeEventListener("pointerup", up);
      if (moved) { renderTimeline(); return; }
      openMusicSegSheet(m);
    };
    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", up);
  });
}

/* kırpma tutamaçları: fotoğrafta süre uzatma, videoda kesme.
   Sürükleme sırasında DOM yeniden KURULMAZ (tutamaç yok olup sürükleme
   kopar); yalnızca bu klibin genişliği ve rozeti güncellenir, kesilen
   uçtaki kare canlı önizlenir. */
function bindTrim(handle, clip, side) {
  handle.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation();
    try { handle.setPointerCapture(e.pointerId); } catch (_) {}
    pushHistory();
    const startX = e.clientX;
    const orig = { in: clip.in, out: clip.out };
    const clipEl = handle.parentElement;
    const badge = clipEl.querySelector(".badge");
    if (state.playing) pause();
    const move = ev => {
      const dxSec = (ev.clientX - startX) / state.pps * clip.speed;
      if (side === "l") {
        clip.in = clamp(orig.in + dxSec, 0, clip.out - .15);
      } else {
        const maxOut = clip.type === "image" ? 600 : clip.natDur;
        clip.out = clamp(orig.out + dxSec, clip.in + .15, maxOut);
      }
      clipEl.style.width = Math.max(clipDur(clip) * state.pps, 24) + "px";
      if (badge) {
        badge.textContent =
          (clip.effect !== "none" ? "✨ " : "") +
          (clip.speed !== 1 ? clip.speed + "x · " : "") + clipDur(clip).toFixed(1) + "s";
      }
      /* kesilen uçtaki kareyi canlı göster (kaydırma yapmadan) */
      state.t = clamp(clipStart(clip) + (side === "l" ? .01 : clipDur(clip) - .01), 0, totalDur());
      if (clip.type === "video") {
        const target = side === "l" ? clip.in : Math.max(clip.out - .05, clip.in);
        if (Math.abs(clip.el.currentTime - target) > .05) {
          try { clip.el.currentTime = target; } catch (_) {}
        }
      }
      invalidate();
    };
    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      renderAll();
      seekTo(Math.min(state.t, totalDur()), true);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
  });
}

/* ---------- yakınlaştırma ---------- */
$("#btnZoomIn").onclick = () => { state.pps = Math.min(state.pps * 1.4, 240); renderAll(); };
$("#btnZoomOut").onclick = () => { state.pps = Math.max(state.pps / 1.4, 16); renderAll(); };

/* ---------- klip silme ---------- */
$("#btnUndoDel").onclick = () => {
  const c = targetClip();
  if (!c) return;
  pushHistory();
  state.clips.splice(state.clips.indexOf(c), 1);
  state.selClip = null;
  if (!state.clips.length) {
    $("#emptyState").style.display = "flex";
    $("#btnExport").disabled = true;
    state.t = 0;
  } else seekTo(Math.min(state.t, totalDur()), true);
  renderAll();
  toast("Klip silindi");
};

/* ---------- araç çubuğu ---------- */
document.querySelectorAll("#toolbar .tool").forEach(btn => {
  btn.addEventListener("click", () => handleTool(btn.dataset.tool));
});

function handleTool(tool) {
  switch (tool) {
    case "add": $("#fileVideo").click(); break;
    case "split": splitAtPlayhead(); break;
    case "transition": openTransSheetNearPlayhead(); break;
    case "effect": openEffectSheet(); break;
    case "duplicate": duplicateClip(); break;
    case "speed": openSpeedSheet(); break;
    case "volume": openVolumeSheet(); break;
    case "filter": openFilterSheet(); break;
    case "adjust": openAdjustSheet(); break;
    case "text": openTextSheet(state.selOv && state.selOv.kind === "text" ? state.selOv : null); break;
    case "sticker": openStickerSheet(); break;
    case "pip":
      if (!state.clips.length) { toast("Önce ana video/fotoğraf ekle"); break; }
      $("#filePip").click();
      break;
    case "music": openMusicSheet(); break;
    case "aspect": openAspectSheet(); break;
  }
}

function splitAtPlayhead() {
  const loc = locate(state.t);
  if (!loc) return;
  const c = loc.clip;
  const srcT = c.in + loc.offset * c.speed;
  if (srcT - c.in < .15 || c.out - srcT < .15) { toast("Bölmek için oynatma çubuğunu klibin ortasına getir"); return; }
  pushHistory();
  const right = { ...c, id: idSeq++, adjust: { ...c.adjust }, trans: { ...c.trans }, in: srcT };
  c.out = srcT;
  c.trans = { type: "none", dur: .6 };  // yeni sınır geçişsiz başlar
  state.clips.splice(state.clips.indexOf(c) + 1, 0, right);
  state.selClip = c;
  renderAll();
  toast("Klip bölündü — aradaki | düğmesiyle geçiş ekleyebilirsin");
}

function duplicateClip() {
  const c = targetClip();
  if (!c) return;
  pushHistory();
  let el = c.el;
  if (c.type === "video") {
    el = document.createElement("video");
    el.src = c.url; el.preload = "auto";
    el.playsInline = true; el.setAttribute("playsinline", "");
  }
  const copy = { ...c, id: idSeq++, el, adjust: { ...c.adjust }, trans: { ...c.trans } };
  state.clips.splice(state.clips.indexOf(c) + 1, 0, copy);
  renderAll();
  toast("Klip kopyalandı");
}

/* ---------- bottom sheet altyapısı ---------- */
const sheet = $("#sheet");
function openSheet(title, buildFn) {
  if (state.projectId) pushHistory();
  $("#sheetTitle").textContent = title;
  const body = $("#sheetBody");
  body.innerHTML = "";
  buildFn(body);
  sheet.classList.add("open");
}
$("#sheetClose").onclick = () => {
  sheet.classList.remove("open");
  if (typeof stopLibPreview === "function") stopLibPreview();
};

function sliderRow(body, label, min, max, step, val, fmtFn, onInput) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"><span class="val"></span>`;
  const inp = row.querySelector("input"), out = row.querySelector(".val");
  out.textContent = fmtFn(val);
  inp.oninput = () => { const v = parseFloat(inp.value); out.textContent = fmtFn(v); onInput(v); };
  body.appendChild(row);
  return inp;
}

function chipRow(body, options, current, onPick, filterFn) {
  const chips = document.createElement("div");
  chips.className = "chips";
  for (const [key, label] of Object.entries(options)) {
    if (filterFn && !filterFn(key)) continue;
    const b = document.createElement("button");
    b.className = "chip" + (current === key ? " sel" : "");
    b.textContent = label;
    b.onclick = () => {
      chips.querySelectorAll(".chip").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      onPick(key);
    };
    chips.appendChild(b);
  }
  body.appendChild(chips);
  return chips;
}

function subhead(body, text) {
  const h = document.createElement("div");
  h.className = "subhead";
  h.textContent = text;
  body.appendChild(h);
}

/* ---------- Geçiş ---------- */
function openTransSheetNearPlayhead() {
  if (state.clips.length < 2) { toast("Geçiş için en az iki klip gerekli"); return; }
  /* seçili klip varsa onun sonrasındaki sınır; yoksa oynatma çubuğuna en yakın sınır */
  let left = null;
  if (state.selClip && state.clips.indexOf(state.selClip) < state.clips.length - 1) {
    left = state.selClip;
  } else {
    let acc = 0, best = Infinity;
    for (let i = 0; i < state.clips.length - 1; i++) {
      acc += clipDur(state.clips[i]);
      const d = Math.abs(acc - state.t);
      if (d < best) { best = d; left = state.clips[i]; }
    }
  }
  if (left) openTransSheet(left);
}

function openTransSheet(leftClip) {
  openSheet("Geçiş", body => {
    subhead(body, "Tür");
    chipRow(body, TRANSITIONS, leftClip.trans.type, key => {
      leftClip.trans.type = key;
      renderTimeline();
      /* önizleme: geçişin başına sar */
      const b = clipStart(leftClip) + clipDur(leftClip);
      seekTo(Math.max(b - .01, 0), true);
      setTimeout(() => { seekTo(b + .01, true); play(); }, 60);
    });
    subhead(body, "Süre");
    sliderRow(body, "Süre", .3, 1.5, .1, leftClip.trans.dur, v => v.toFixed(1) + "s", v => leftClip.trans.dur = v);
  });
}

/* ---------- Efekt (CapCut tarzı: arama + sekmeler + kutucuklar) ---------- */
function openEffectSheet() {
  const c = targetClip(); if (!c) return;
  let cat = "all", query = "";
  openSheet("Efektler", body => {
    const search = document.createElement("input");
    search.className = "fxSearch";
    search.placeholder = "🔍 Efekt ara…";
    body.appendChild(search);

    const tabs = document.createElement("div");
    tabs.className = "fxTabs";
    body.appendChild(tabs);

    const grid = document.createElement("div");
    grid.className = "fxGrid";
    body.appendChild(grid);

    const renderTabs = () => {
      tabs.innerHTML = "";
      for (const [key, label] of Object.entries(FX_CATS)) {
        const t = document.createElement("button");
        t.className = "fxTab" + (cat === key ? " sel" : "");
        t.textContent = label;
        t.onclick = () => { cat = key; renderTabs(); renderGrid(); };
        tabs.appendChild(t);
      }
    };
    const renderGrid = () => {
      grid.innerHTML = "";
      for (const [key, f] of Object.entries(EFFECTS)) {
        if (cat !== "all" && f.cat !== cat && key !== "none") continue;
        if (query && !f.name.toLocaleLowerCase("tr").includes(query)) continue;
        const it = document.createElement("button");
        it.className = "fxTile" + (c.effect === key ? " sel" : "");
        it.innerHTML = `<span class="tile" style="background:${f.grad}">${f.icon}</span><span class="nm">${f.name}</span>`;
        it.onclick = () => {
          c.effect = key;
          grid.querySelectorAll(".fxTile").forEach(x => x.classList.remove("sel"));
          it.classList.add("sel");
          renderTimeline();
          if (!state.playing && key !== "none") play();
        };
        grid.appendChild(it);
      }
    };
    search.oninput = () => { query = search.value.trim().toLocaleLowerCase("tr"); renderGrid(); };
    renderTabs();
    renderGrid();
  });
}

/* ---------- Hız (0.01x – 10x, logaritmik sürgü) ---------- */
function openSpeedSheet() {
  const c = targetClip(); if (!c) return;
  openSheet("Hız", body => {
    const fmtSpeed = v => (v >= 1 ? v.toFixed(2).replace(/\.?0+$/, "") : v.toFixed(2)) + "x";
    const slider = sliderRow(body, "Hız", -2, 1, .01, Math.log10(clamp(c.speed, .01, 10)),
      v => fmtSpeed(Math.pow(10, v)),
      v => {
        c.speed = clamp(Math.round(Math.pow(10, v) * 100) / 100, .01, 10);
        scheduleTimeline();
      });

    const chips = document.createElement("div");
    chips.className = "chips";
    [0.25, 0.5, 1, 1.5, 2, 4].forEach(s => {
      const b = document.createElement("button");
      b.className = "chip" + (c.speed === s ? " sel" : "");
      b.textContent = s + "x";
      b.onclick = () => {
        c.speed = s;
        slider.value = Math.log10(s);
        slider.dispatchEvent(new Event("input"));
        chips.querySelectorAll(".chip").forEach(x => x.classList.remove("sel"));
        b.classList.add("sel");
        renderAll();
      };
      chips.appendChild(b);
    });
    body.appendChild(chips);

    const pitchBtn = document.createElement("button");
    pitchBtn.className = "sheetBtn";
    const pLabel = () => "🎼 Ses perdesini değiştir: " + (c.pitchShift ? "Açık" : "Kapalı");
    pitchBtn.textContent = pLabel();
    pitchBtn.onclick = () => { c.pitchShift = !c.pitchShift; pitchBtn.textContent = pLabel(); };
    body.appendChild(pitchBtn);

    const hint = document.createElement("p");
    hint.style.cssText = "font-size:11px;color:var(--dim);text-align:center;margin-top:6px";
    hint.textContent = "Açık: hız değişince ses inceler/kalınlaşır. Not: 0.06x altı hızlar önizlemede takılabilir, render'da sorunsuzdur.";
    body.appendChild(hint);
  });
}

/* ---------- Metin ---------- */
function openTextSheet(existing) {

$("#filePip").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  pushHistory();
  const url = URL.createObjectURL(f);
  const mediaId = uid();
  idbPut("media", { id: mediaId, blob: f, name: f.name, type: f.type }).catch(() => {});
  const isImg = f.type.startsWith("image/");
  let el, natDur = 3;
  if (isImg) {
    el = new Image();
    const ok = await new Promise(r => { el.onload = () => r(true); el.onerror = () => r(false); el.src = url; });
    if (!ok) { toast("Görsel açılamadı"); return; }
  } else {
    el = document.createElement("video");
    el.preload = "auto";
    el.playsInline = true; el.setAttribute("playsinline", "");
    el.addEventListener("seeked", invalidate);
    el.src = url;
    const ok = await new Promise(r => { el.onloadedmetadata = () => r(true); el.onerror = () => r(false); });
    if (!ok) { toast("Video açılamadı"); return; }
    natDur = await resolveDuration(el);
  }
  const o = {
    id: idSeq++, kind: "pip", type: isImg ? "image" : "video",
    mediaId, name: f.name, content: (isImg ? "🖼 " : "🎬 ") + f.name,
    url, el, natDur, in: 0,
    start: state.t, dur: isImg ? 3 : Math.min(natDur, Math.max(totalDur() - state.t, 1)),
    x: .5, y: .35, scale: .45, volume: 1,
    size: .1, color: "#fff", bg: false,
    animIn: "none", loop: "none",
  };
  state.overlays.push(o);
  state.selOv = o;
  renderTimeline();
  invalidate();
  openPipSheet(o);
  toast("Bindirme eklendi — sürükle, iki parmakla boyutlandır");
};

/* katman sırası: dizideki konum çizim sırasıdır (sondaki en önde) */
function moveOverlayZ(o, dir) {
  const i = state.overlays.indexOf(o);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= state.overlays.length) return;
  state.overlays.splice(i, 1);
  state.overlays.splice(j, 0, o);
  renderTimeline();
  invalidate();
  toast(dir > 0 ? "Öne getirildi" : "Arkaya gönderildi");
}
