function openMusicSegSheet(m) {
  openSheet("Müzik 🎵 " + m.name, body => {
    sliderRow(body, "Ses", 0, 1, .05, m.volume, v => Math.round(v * 100) + "%", v => m.volume = v);
    sliderRow(body, "🔊 Bas Güçlendir", 0, 15, 1, m.bass || 0, v => v > 0 ? "+" + v + " dB" : "Kapalı", v => m.bass = v);
    sliderRow(body, "Hız", -1, 1, .01, Math.log10(clamp(m.speed, .1, 10)),
      v => Math.pow(10, v).toFixed(2) + "x",
      v => {
        m.speed = clamp(Math.round(Math.pow(10, v) * 100) / 100, .1, 10);
        scheduleTimeline();
      });

    const split = document.createElement("button");
    split.className = "sheetBtn";
    split.textContent = "✂️ Oynatma çubuğunda böl";
    split.onclick = () => {
      const t = state.t;
      const d = musicDur(m);
      if (t <= m.start + .15 || t >= m.start + d - .15) { toast("Bölmek için çubuğu müziğin ortasına getir"); return; }
      const srcT = m.in + (t - m.start) * m.speed;
      const right = {
        ...m, id: idSeq++, start: t, in: srcT,
        el: new Audio(m.url),
      };
      right.el.preload = "auto";
      m.out = srcT;
      state.musics.push(right);
      sheet.classList.remove("open");
      renderTimeline();
      toast("Müzik bölündü");
    };
    body.appendChild(split);

    const loopBtn = document.createElement("button");
    loopBtn.className = "sheetBtn";
    loopBtn.textContent = "🔁 Video sonuna kadar döngüle";
    loopBtn.onclick = () => {
      const end = contentEnd();
      let cursor = m.start + musicDur(m);
      if (cursor >= end - .3) { toast("Müzik zaten video sonuna ulaşıyor"); return; }
      let guard = 0;
      while (cursor < end - .3 && guard < 40) {
        const cp = { ...m, id: idSeq++, start: cursor, in: m.in, out: m.out, el: new Audio(m.url) };
        cp.el.preload = "auto";
        const remain = end - cursor;
        if (musicDur(cp) > remain) cp.out = Math.min(cp.in + remain * cp.speed, cp.natDur);
        state.musics.push(cp);
        cursor += musicDur(cp);
        guard++;
      }
      sheet.classList.remove("open");
      renderTimeline();
      toast("Müzik video sonuna kadar döngülendi 🔁");
    };
    body.appendChild(loopBtn);

    const fitBtn = document.createElement("button");
    fitBtn.className = "sheetBtn";
    fitBtn.textContent = "🎬 Videonun sonunda kes (aynı anda bitsin)";
    fitBtn.onclick = () => {
      const end = contentEnd();   // kliplerin bittiği an
      const newDurTl = end - m.start;
      if (newDurTl < .3) { toast("Müzik videonun bitiminden sonra başlıyor"); return; }
      if (m.start + musicDur(m) <= end + .01) { toast("Müzik zaten videoyla birlikte veya daha önce bitiyor"); return; }
      m.out = Math.min(m.in + newDurTl * m.speed, m.natDur);
      renderTimeline();
      seekTo(Math.min(state.t, totalDur()), true);
      toast("Müzik video sonunda kesildi ✂️");
    };
    body.appendChild(fitBtn);

    const toPh = document.createElement("button");
    toPh.className = "sheetBtn";
    toPh.textContent = "⏱ Başlangıcı oynatma çubuğuna al";
    toPh.onclick = () => { m.start = state.t; renderTimeline(); toast("Başlangıç güncellendi"); };
    body.appendChild(toPh);

    const del = document.createElement("button");
    del.className = "sheetBtn danger";
    del.textContent = "Bu Parçayı Sil";
    del.onclick = () => {
      m.el.pause();
      state.musics = state.musics.filter(x => x !== m);
      sheet.classList.remove("open");
      renderTimeline();
      seekTo(Math.min(state.t, totalDur()), true);
    };
    body.appendChild(del);

    const hint = document.createElement("p");
    hint.style.cssText = "font-size:11px;color:var(--dim);text-align:center;margin-top:6px";
    hint.textContent = "İpucu: çubuğu ortadan sürükleyip taşı, uçlarından kırp.";
    body.appendChild(hint);
  });
}

function openAspectSheet() {

/* seçilen oran + çözünürlükten çift sayıya yuvarlanmış piksel boyutu */
function exportDims() {
  const [rw, rh] = ASPECTS[state.aspect];
  let res = state.resolution;
  if (state.upscale) res = Math.min(Math.round(res * 1.5), 2880);
  const even = v => Math.round(v / 2) * 2;
  return rw <= rh
    ? [even(res), even(res * rh / rw)]
    : [even(res * rw / rh), even(res)];
}
/* çözünürlük ve fps'e göre video bit hızı (~0.22 bit/piksel/kare) */
function exportBitrate() {
  return Math.min(Math.round(state.exportW * state.exportH * state.fps * .22), 45_000_000);
}
function applyAspect() {
  const [w, h] = exportDims();
  state.exportW = w; state.exportH = h;
  fitPreview();
  setCanvasResolution(false);
  drawFrame();
}
/* Önizlemede canvas ekran boyutunda çalışır (kat kat daha az piksel =
   akıcı düzenleme); dışa aktarmada tam çözünürlüğe geçilir. */
function setCanvasResolution(forExport) {
  if (forExport) {
    canvas.width = state.exportW;
    canvas.height = state.exportH;
  } else {
    const box = $("#previewBox");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.min(Math.max(Math.round(box.clientWidth * dpr), 180), state.exportW);
    canvas.width = w;
    canvas.height = Math.round(w * state.exportH / state.exportW);
  }
  /* canvas boyutu değişince bağlam ayarları sıfırlanır; ölçekleme kalitesi:
     dışa aktarmada yüksek (upscale netliği), önizlemede hızlı */
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = forExport ? "high" : "low";
  noisePat = null;   // desen ölçeği canvas'a bağlı; yeniden üret
  invalidate();
}
function fitPreview() {
  const wrap = $("#previewWrap");
  const availW = wrap.clientWidth - 16, availH = wrap.clientHeight - 16;
  const ar = state.exportW / state.exportH;
  let w = availW, h = w / ar;
  if (h > availH) { h = availH; w = h * ar; }
  const box = $("#previewBox");
  box.style.width = w + "px";
  box.style.height = h + "px";
}
window.addEventListener("resize", () => {
  fitPreview();
  if (!state.rendering) setCanvasResolution(false);
  renderTimeline();

const srcNodes = new Map();

function getSource(el) {

  return srcNodes.get(el);
}

async function startExport() {
  if (!state.clips.length) return;
  pause();
  saveProject();
  exportAbort = false;

  /* proje ses içeriyor mu? (opus desteklenmiyorsa gerçek zamanlıya düş) */
  const hasAudio = state.clips.some(c => c.type === "video" && c.volume > 0) ||
    state.overlays.some(o => o.kind === "pip" && o.type === "video" && o.volume > 0) ||
    state.musics.length > 0;

  /* Hızlı Mod: kare kare offline render yerine cihazın yerleşik
     kaydedicisi (gerçek zamanlı). Safari/iPad'de kare kare sarma
     yavaş olduğu için orada çok daha hızlıdır. */
  if (state.fastMode) { await realtimeExport(); return; }

  if (window.VideoEncoder) {
    const plan = await buildExportPlan(hasAudio);
    if (plan) {
      try {
        await fastRender(plan);
        return;
      } catch (err) {
        finishExportUI();
        if (exportAbort) return;
        console.error("fastRender:", err);
        toast("Hızlı render başarısız, gerçek zamanlı kayda geçildi");
      }
    }
  }
  await realtimeExport();
}

/* çıktı planı: format tercihine göre desteklenen video/ses kodlayıcı +
   kapsayıcı seçilir. MP4 istenip H.264 yoksa VP9-MP4, o da yoksa WebM'e
   düşülür (gerçek telefonlarda H.264+AAC yolu kullanılır). */
async function buildExportPlan(hasAudio) {
  const W = state.exportW, H = state.exportH;
  const vidSup = async c => { try { return (await VideoEncoder.isConfigSupported({ codec: c, width: W, height: H, bitrate: exportBitrate(), framerate: state.fps })).supported; } catch (_) { return false; } };
  const audSup = async c => { if (!window.AudioEncoder) return false; try { return (await AudioEncoder.isConfigSupported({ codec: c, sampleRate: 48000, numberOfChannels: 2, bitrate: 128000 })).supported; } catch (_) { return false; } };

  const AVC = ["avc1.4d0028", "avc1.42001f", "avc1.640028", "avc1.42e01f"];
  let vEnc = null, vKind = null, container = null;

  if (state.format === "mp4") {
    for (const c of AVC) if (await vidSup(c)) { vEnc = c; vKind = "avc"; container = "mp4"; break; }
    if (!vEnc && await vidSup("vp09.00.10.08")) { vEnc = "vp09.00.10.08"; vKind = "vp9"; container = "mp4"; }
  }
  if (!vEnc) {   // webm istendi ya da mp4 için codec yok
    if (await vidSup("vp09.00.10.08")) { vEnc = "vp09.00.10.08"; vKind = "vp9"; }
    else if (await vidSup("vp8")) { vEnc = "vp8"; vKind = "vp8"; }
    container = "webm";
  }
  if (!vEnc) return null;

  let aEnc = null, aKind = null;
  if (hasAudio) {
    if (container === "mp4" && await audSup("mp4a.40.2")) { aEnc = "mp4a.40.2"; aKind = "aac"; }
    else if (await audSup("opus")) { aEnc = "opus"; aKind = "opus"; }
    /* MP4 + yalnızca Opus destekleniyorsa Opus-in-MP4 kullanılır */
  }
  if (state.format === "mp4" && container !== "mp4") toast("Bu cihazda MP4 kodlama yok, WebM üretiliyor");
  return { vEnc, vKind, container, aEnc, aKind };
}

/* ---------- hızlı render: yardımcılar ---------- */
function seekVideoExact(v, target) {
  return new Promise(res => {
    if (v.readyState >= 2 && Math.abs(v.currentTime - target) < .01) return res();
    let done = false;
    const fin = () => {
      if (done) return;
      done = true;
      v.removeEventListener("seeked", fin);
      clearTimeout(to);
      res();
    };
    const to = setTimeout(fin, 900);
    v.addEventListener("seeked", fin);
    try { v.currentTime = target; } catch (_) { fin(); }
  });
}

/* geçişteki önceki klip + aktif bindirme videolarını kesin kareye sar */
async function renderSeekExtras(t) {
  const loc = locate(t);
  if (!loc) return;
  const idx = state.clips.indexOf(loc.clip);
  const prev = idx > 0 ? state.clips[idx - 1] : null;
  if (prev && prev.trans.type !== "none" && (t - clipStart(loc.clip)) < prev.trans.dur && prev.type === "video") {
    await seekVideoExact(prev.el, Math.max(prev.out - .05, prev.in));
  }
  for (const o of state.overlays) {
    if (o.kind !== "pip" || o.type !== "video") continue;
    if (t < o.start || t > o.start + o.dur) continue;
    await seekVideoExact(o.el, o.in + (t - o.start));
  }
}

const audioBufCache = new Map();
async function decodeMediaAudio(mediaId) {
  if (audioBufCache.has(mediaId)) return audioBufCache.get(mediaId);
  let buf = null;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const rec = await idbGet("media", mediaId);
    if (rec) buf = await audioCtx.decodeAudioData(await rec.blob.arrayBuffer());
  } catch (_) { buf = null; }
  audioBufCache.set(mediaId, buf);
  return buf;
}

/* tüm ses parçalarını offline miksle → tek AudioBuffer */
async function mixAudioOffline(totalSec) {
  const sr = 48000;
  const oac = new OfflineAudioContext(2, Math.max(Math.ceil(totalSec * sr), sr), sr);
  let any = false, t0 = 0;
  for (const c of state.clips) {
    const d = clipDur(c);
    if (c.type === "video" && c.volume > 0 && c.mediaId) {
      const buf = await decodeMediaAudio(c.mediaId);
      if (buf) {
        const src = oac.createBufferSource();
        src.buffer = buf;
        src.playbackRate.value = c.speed;
        const g = oac.createGain();
        g.gain.value = c.volume;
        src.connect(g).connect(oac.destination);
        try { src.start(t0, Math.min(c.in, buf.duration), Math.max(c.out - c.in, .01)); any = true; } catch (_) {}
      }
    }
    t0 += d;
  }
  /* bindirme (PiP) video sesleri */
  for (const o of state.overlays) {
    if (o.kind !== "pip" || o.type !== "video" || !o.mediaId || o.volume <= 0) continue;
    if (o.start >= totalSec) continue;
    const buf = await decodeMediaAudio(o.mediaId);
    if (!buf) continue;
    const src = oac.createBufferSource();
    src.buffer = buf;
    const g = oac.createGain();
    g.gain.value = o.volume;
    src.connect(g).connect(oac.destination);
    const playDur = Math.min(o.dur, buf.duration - o.in, totalSec - o.start);
    if (playDur > .01) {
      try { src.start(o.start, Math.min(o.in, buf.duration), playDur); any = true; } catch (_) {}
    }
  }
  for (const m of state.musics) {
    if (!m.mediaId || m.volume <= 0 || m.start >= totalSec) continue;
    const buf = await decodeMediaAudio(m.mediaId);
    if (!buf) continue;
    const src = oac.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = m.speed;
    const g = oac.createGain();
    g.gain.value = m.volume;
    src.connect(g);
    if (m.bass > 0) {   // bas güçlendirme: low-shelf filtre
      const f = oac.createBiquadFilter();
      f.type = "lowshelf"; f.frequency.value = 150; f.gain.value = m.bass;
      g.connect(f); f.connect(oac.destination);
    } else g.connect(oac.destination);
    const playSrc = Math.min(m.out, buf.duration) - m.in;
    if (playSrc > .01) {
      try { src.start(m.start, Math.min(m.in, buf.duration), playSrc); any = true; } catch (_) {}
    }
  }
  if (!any) return null;
  return oac.startRendering();
}

/* ---------- minimal WebM (Matroska) muxer ---------- */
function mkWebm(opts) {
  const { width, height, codecId, durationMs } = opts;
  const chunks = [];   // {track, ts(ms), key, data}

  const u8cat = arrs => {
    let n = 0;
    for (const a of arrs) n += a.length;
    const out = new Uint8Array(n);
    let o = 0;
    for (const a of arrs) { out.set(a, o); o += a.length; }
    return out;
  };
  const idBytes = id => {
    const b = [];
    while (id > 0) { b.unshift(id & 0xff); id = Math.floor(id / 256); }
    return new Uint8Array(b);
  };
  const vint = n => {   // EBML boyut kodlaması
    let len = 1;
    while (n >= Math.pow(2, 7 * len) - 1 && len < 8) len++;
    const b = new Uint8Array(len);
    for (let i = 0; i < len; i++) b[len - 1 - i] = Math.floor(n / Math.pow(2, 8 * i)) % 256;
    b[0] |= 0x80 >> (len - 1);
    return b;
  };
  const uintBytes = n => {
    const b = [];
    do { b.unshift(n % 256); n = Math.floor(n / 256); } while (n > 0);
    return new Uint8Array(b);
  };
  const f64 = n => {
    const b = new Uint8Array(8);
    new DataView(b.buffer).setFloat64(0, n);
    return b;
  };
  const str = s => new TextEncoder().encode(s);
  const el = (id, payload) => {
    const p = payload instanceof Uint8Array ? payload : u8cat(payload);
    return u8cat([idBytes(id), vint(p.length), p]);
  };

  return {
    addVideo(chunk) {
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      chunks.push({ track: 1, ts: chunk.timestamp / 1000, key: chunk.type === "key", data: d });
    },
    addAudio(chunk) {
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      chunks.push({ track: 2, ts: chunk.timestamp / 1000, key: true, data: d });
    },
    finish({ hasAudio, opusHead }) {
      const header = el(0x1A45DFA3, [
        el(0x4286, uintBytes(1)),  // EBMLVersion
        el(0x42F7, uintBytes(1)),  // EBMLReadVersion
        el(0x42F2, uintBytes(4)),  // EBMLMaxIDLength
        el(0x42F3, uintBytes(8)),  // EBMLMaxSizeLength
        el(0x4282, str("webm")),   // DocType
        el(0x4287, uintBytes(4)),  // DocTypeVersion
        el(0x4285, uintBytes(2)),  // DocTypeReadVersion
      ]);
      const info = el(0x1549A966, [
        el(0x2AD7B1, uintBytes(1000000)),  // TimecodeScale: 1 ms
        el(0x4489, f64(durationMs)),       // Duration
        el(0x4D80, str("PisanCut")),
        el(0x5741, str("PisanCut")),
      ]);
      const videoTrack = el(0xAE, [
        el(0xD7, uintBytes(1)),    // TrackNumber
        el(0x73C5, uintBytes(1)),  // TrackUID
        el(0x83, uintBytes(1)),    // TrackType: video
        el(0x86, str(codecId)),
        el(0xE0, [ el(0xB0, uintBytes(width)), el(0xBA, uintBytes(height)) ]),
      ]);
      const trackList = [videoTrack];
      if (hasAudio) {
        trackList.push(el(0xAE, [
          el(0xD7, uintBytes(2)),
          el(0x73C5, uintBytes(2)),
          el(0x83, uintBytes(2)),    // TrackType: audio
          el(0x86, str("A_OPUS")),
          el(0x56AA, uintBytes(6500000)),    // CodecDelay (ns)
          el(0x56BB, uintBytes(80000000)),   // SeekPreRoll (ns)
          el(0x63A2, opusHead),              // CodecPrivate: OpusHead
          el(0xE1, [ el(0xB5, f64(48000)), el(0x9F, uintBytes(2)) ]),
        ]));
      }
      const tracks = el(0x1654AE6B, trackList);

      chunks.sort((a, b) => (a.ts - b.ts) || (a.track - b.track));
      const clusters = [];
      let cur = null, curTs = 0;
      const flushCluster = () => {
        if (!cur) return;
        clusters.push(el(0x1F43B675, [ el(0xE7, uintBytes(Math.round(curTs))), ...cur ]));
        cur = null;
      };
      for (const c of chunks) {
        const needNew = !cur ||
          (c.track === 1 && c.key && c.ts - curTs >= 1000) ||
          (c.ts - curTs > 30000);
        if (needNew) { flushCluster(); cur = []; curTs = c.ts; }
        const rel = Math.max(Math.round(c.ts - curTs), 0);
        const head = new Uint8Array(4);
        head[0] = 0x80 | c.track;
        head[1] = (rel >> 8) & 0xff;
        head[2] = rel & 0xff;
        head[3] = c.key ? 0x80 : 0x00;
        cur.push(el(0xA3, u8cat([head, c.data])));   // SimpleBlock
      }
      flushCluster();

      /* Segment: bilinmeyen boyut (canlı muxer'lar gibi) — geri yazma gerekmez */
      const segHead = u8cat([idBytes(0x18538067), new Uint8Array([0x01, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff])]);
      return new Blob([header, segHead, info, tracks, ...clusters], { type: "video/webm" });
    },
  };
}

const OPUS_HEAD_DEFAULT = (() => {
  const b = new Uint8Array(19);
  b.set(new TextEncoder().encode("OpusHead"), 0);
  b[8] = 1;             // sürüm
  b[9] = 2;             // kanal
  b[10] = 0x38; b[11] = 0x01;   // preSkip = 312 (LE)
  b[12] = 0x80; b[13] = 0xBB; b[14] = 0x00; b[15] = 0x00;  // 48000 Hz (LE)
  return b;             // gain=0, mapping=0
})();

/* ---------- minimal MP4 (ISO-BMFF) muxer ----------
   Sıkıştırılmamış (tek mdat) MP4. Video: H.264 (avc1/avcC) veya
   VP9 (vp09/vpcC). Ses: AAC (mp4a/esds) veya Opus (Opus/dOps).
   Kutu yapısı ve stco ofsetleri VP9+Opus ile uçtan uca doğrulanır;
   gerçek cihazlarda aynı yapı H.264+AAC ile kullanılır. */
function mkMp4(opts) {
  const { width, height } = opts;   // codec açıklamaları finish()'te verilir
  const VTS = 90000;
  const vSamples = [], aSamples = [];
  const enc = new TextEncoder();

  const u32 = n => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n >>> 0); return b; };
  const u16 = n => { const b = new Uint8Array(2); new DataView(b.buffer).setUint16(0, n & 0xffff); return b; };
  const cat = arrs => {
    let n = 0; for (const a of arrs) n += a.length;
    const o = new Uint8Array(n); let p = 0;
    for (const a of arrs) { o.set(a, p); p += a.length; }
    return o;
  };
  const box = (type, ...parts) => {
    const payload = cat(parts.map(p => p instanceof Uint8Array ? p : cat(p)));
    return cat([u32(payload.length + 8), enc.encode(type), payload]);
  };
  const fbox = (type, ver, flags, ...parts) =>
    box(type, new Uint8Array([ver, (flags >> 16) & 255, (flags >> 8) & 255, flags & 255]), ...parts);

  return {
    addVideo(chunk) {
      const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d);
      const dur = chunk.duration ? Math.round(chunk.duration / 1e6 * VTS) : Math.round(VTS / 30);
      vSamples.push({ data: d, dur, key: chunk.type === "key" });
    },
    addAudio(chunk) {
      const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d);
      const dur = chunk.duration ? Math.round(chunk.duration / 1e6 * 48000) : 1024;
      aSamples.push({ data: d, dur });
    },
    finish(fin) {
      const { vcodec, vdesc, acodec, adesc, sampleRate = 48000, channels = 2 } = fin;
      const hasAudio = aSamples.length > 0;
      const vBytes = cat(vSamples.map(s => s.data));
      const aBytes = hasAudio ? cat(aSamples.map(s => s.data)) : new Uint8Array(0);

      const ftyp = box("ftyp", enc.encode("isom"), u32(0x200), enc.encode("isomiso2avc1mp41"));
      const mdatSize = 8 + vBytes.length + aBytes.length;
      const mdat = cat([u32(mdatSize), enc.encode("mdat"), vBytes, aBytes]);
      const vChunkOff = ftyp.length + 8;
      const aChunkOff = vChunkOff + vBytes.length;

      const vDurTotal = vSamples.reduce((a, s) => a + s.dur, 0);
      const aDurTotal = aSamples.reduce((a, s) => a + s.dur, 0);
      const durMs = Math.round((vDurTotal / VTS) * 1000);

      /* --- stbl kutuları --- */
      const stts = samples => {
        const runs = [];
        for (const s of samples) {
          const last = runs[runs.length - 1];
          if (last && last.dur === s.dur) last.count++;
          else runs.push({ count: 1, dur: s.dur });
        }
        return fbox("stts", 0, 0, u32(runs.length), ...runs.map(r => cat([u32(r.count), u32(r.dur)])));
      };
      const stsz = samples => fbox("stsz", 0, 0, u32(0), u32(samples.length), ...samples.map(s => u32(s.data.length)));
      const stsc = fbox("stsc", 0, 0, u32(1), cat([u32(1), u32(0), u32(1)]));  // sonradan doldurulur
      const stscN = n => fbox("stsc", 0, 0, u32(1), cat([u32(1), u32(n), u32(1)]));
      const stco = off => fbox("stco", 0, 0, u32(1), u32(off));

      /* video sample entry */
      let vEntry;
      if (vcodec === "avc") {
        vEntry = box("avc1",
          new Uint8Array(6), u16(1),                 // reserved + data_ref_index
          new Uint8Array(16),                        // pre-defined/reserved
          u16(width), u16(height),
          u32(0x00480000), u32(0x00480000),          // 72dpi h/v
          u32(0), u16(1),                            // reserved, frame_count
          new Uint8Array(32),                        // compressorname
          u16(0x0018), u16(0xffff),                  // depth, pre-defined
          box("avcC", vdesc));
      } else {
        vEntry = box("vp09",
          new Uint8Array(6), u16(1), new Uint8Array(16),
          u16(width), u16(height),
          u32(0x00480000), u32(0x00480000), u32(0), u16(1),
          new Uint8Array(32), u16(0x0018), u16(0xffff),
          fbox("vpcC", 1, 0, new Uint8Array([1, 8, 0, 1, 1, 1]), u16(0)));  // profil0, 8bit, bt709
      }
      const vStbl = box("stbl",
        fbox("stsd", 0, 0, u32(1), vEntry),
        stts(vSamples), stscN(vSamples.length), stsz(vSamples), stco(vChunkOff),
        (() => {   // stss (anahtar kareler)
          const keys = [];
          vSamples.forEach((s, i) => { if (s.key) keys.push(i + 1); });
          return fbox("stss", 0, 0, u32(keys.length), ...keys.map(u32));
        })());

      const vTrak = box("trak",
        fbox("tkhd", 0, 7, u32(0), u32(0), u32(1), u32(0), u32(durMs),
          new Uint8Array(8), u16(0), u16(0), u16(0), u16(0),
          cat([u32(0x00010000), u32(0), u32(0), u32(0), u32(0x00010000), u32(0), u32(0), u32(0), u32(0x40000000)]),
          u32(width << 16), u32(height << 16)),
        box("mdia",
          fbox("mdhd", 0, 0, u32(0), u32(0), u32(VTS), u32(vDurTotal), u16(0x55c4), u16(0)),
          fbox("hdlr", 0, 0, u32(0), enc.encode("vide"), new Uint8Array(12), enc.encode("VideoHandler\0")),
          box("minf",
            box("vmhd", new Uint8Array([0, 0, 0, 1]), new Uint8Array(8)),
            box("dinf", fbox("dref", 0, 0, u32(1), fbox("url ", 0, 1))),
            vStbl)));

      const traks = [vTrak];
      if (hasAudio) {
        let aEntry;
        if (acodec === "aac") {
          /* esds: ES_Descriptor > DecoderConfig(0x40=AAC) > DecSpecificInfo(ASC)
             DecoderConfig içeriği: objType(1)+streamType(1)+bufferSizeDB(3)
             +maxBitrate(4)+avgBitrate(4) = 13 bayt, sonra DecSpecificInfo */
          const asc = [...adesc];
          const decSpec = [0x05, asc.length, ...asc];              // 2 + asc
          const dcContent = [
            0x40, 0x15,                       // AAC, streamType(5)<<2|reserved
            0x00, 0x00, 0x00,                 // bufferSizeDB (3)
            0x00, 0x01, 0xF4, 0x00,           // maxBitrate = 128000 (4)
            0x00, 0x01, 0xF4, 0x00,           // avgBitrate = 128000 (4)
            ...decSpec,
          ];
          const decCfg = [0x04, dcContent.length, ...dcContent];
          const esContent = [0x00, 0x00, 0x00, ...decCfg, 0x06, 0x01, 0x02];  // ES_ID(2)+flags(1)+decCfg+SLConfig
          const esd = new Uint8Array([0x03, esContent.length, ...esContent]);
          aEntry = box("mp4a",
            new Uint8Array(6), u16(1), new Uint8Array(8),
            u16(channels), u16(16), u32(0), u32(sampleRate << 16),
            fbox("esds", 0, 0, esd));
        } else {
          /* Opus: dOps (OpusSpecificBox), OpusHead'ten türetilir */
          const oh = adesc || OPUS_HEAD_DEFAULT;
          const preSkip = oh[10] | (oh[11] << 8);
          const dOps = box("dOps", new Uint8Array([
            0, channels, (preSkip >> 8) & 255, preSkip & 255,
            (sampleRate >> 24) & 255, (sampleRate >> 16) & 255, (sampleRate >> 8) & 255, sampleRate & 255,
            0, 0, 0]));
          aEntry = box("Opus",
            new Uint8Array(6), u16(1), new Uint8Array(8),
            u16(channels), u16(16), u32(0), u32(sampleRate << 16),
            dOps);
        }
        const aStbl = box("stbl",
          fbox("stsd", 0, 0, u32(1), aEntry),
          stts(aSamples), stscN(aSamples.length), stsz(aSamples), stco(aChunkOff));
        traks.push(box("trak",
          fbox("tkhd", 0, 7, u32(0), u32(0), u32(2), u32(0), u32(durMs),
            new Uint8Array(8), u16(0), u16(0), u16(0x0100), u16(0),
            cat([u32(0x00010000), u32(0), u32(0), u32(0), u32(0x00010000), u32(0), u32(0), u32(0), u32(0x40000000)]),
            u32(0), u32(0)),
          box("mdia",
            fbox("mdhd", 0, 0, u32(0), u32(0), u32(sampleRate), u32(aDurTotal), u16(0x55c4), u16(0)),
            fbox("hdlr", 0, 0, u32(0), enc.encode("soun"), new Uint8Array(12), enc.encode("SoundHandler\0")),
            box("minf",
              box("smhd", new Uint8Array(8)),
              box("dinf", fbox("dref", 0, 0, u32(1), fbox("url ", 0, 1))),
              aStbl))));
      }

      const moov = box("moov",
        fbox("mvhd", 0, 0, u32(0), u32(0), u32(1000), u32(durMs),
          u32(0x00010000), u16(0x0100), u16(0), u32(0), u32(0),
          cat([u32(0x00010000), u32(0), u32(0), u32(0), u32(0x00010000), u32(0), u32(0), u32(0), u32(0x40000000)]),
          new Uint8Array(24), u32(traks.length + 1)),
        ...traks);

      return new Blob([ftyp, mdat, moov], { type: "video/mp4" });
    },
  };
}

/* ---------- hızlı render (kare kare, offline) ---------- */
async function fastRender(plan) {
  const total = totalDur();
  const fps = state.fps;
  const frames = Math.max(Math.ceil(total * fps), 1);
  const withAudio = !!plan.aEnc;
  exportModal("Render alınıyor…", "Kare kare işleniyor — takılma olmadan, tam kalitede.");

  state.rendering = true;
  pause();
  setCanvasResolution(true);

  let opusHead = OPUS_HEAD_DEFAULT;
  let audioIncluded = false, audioDesc = null, videoDesc = null;
  const isMp4 = plan.container === "mp4";
  const webmMuxer = isMp4 ? null : mkWebm({
    width: state.exportW, height: state.exportH,
    codecId: plan.vKind === "vp8" ? "V_VP8" : "V_VP9",
    durationMs: total * 1000,
  });
  /* MP4 muxer'ı önceden kur: kodlanan kareler ANINDA kopyalanıp eklenir
     (native chunk nesneleri bekletilmez) — uzun videolarda bellek dolup
     render'ın yavaşlaması bu şekilde önlenir. Codec açıklamaları finish'te. */
  const mp4Muxer = isMp4 ? mkMp4({ width: state.exportW, height: state.exportH }) : null;

  /* 1) ses: video kodlamasıyla PARALEL mikslenir ve kodlanır */
  const audioJob = !withAudio ? Promise.resolve(null) : (async () => {
    const audioBuffer = await mixAudioOffline(total).catch(() => null);
    if (!audioBuffer || exportAbort) return null;
    const chunks = [];
    let desc = null, count = 0;
    const aenc = new AudioEncoder({
      output: (chunk, meta) => {
        const d = meta && meta.decoderConfig && meta.decoderConfig.description;
        if (d && !desc) desc = d instanceof ArrayBuffer ? new Uint8Array(d) : new Uint8Array(d.buffer, d.byteOffset, d.byteLength);
        count++;
        if (isMp4) mp4Muxer.addAudio(chunk);   // anında kopyala
        else chunks.push(chunk);
      },
      error: e => console.error("AudioEncoder:", e),
    });
    aenc.configure({ codec: plan.aEnc, sampleRate: 48000, numberOfChannels: 2, bitrate: 128000 });
    const sr = 48000, block = plan.aKind === "aac" ? 1024 : 960;
    const ch0 = audioBuffer.getChannelData(0);
    const ch1 = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : ch0;
    const maxSamples = Math.min(audioBuffer.length, Math.ceil(total * sr));
    for (let off = 0; off < maxSamples; off += block) {
      const n = Math.min(block, maxSamples - off);
      const data = new Float32Array(n * 2);
      data.set(ch0.subarray(off, off + n), 0);
      data.set(ch1.subarray(off, off + n), n);
      const ad = new AudioData({
        format: "f32-planar", sampleRate: sr,
        numberOfFrames: n, numberOfChannels: 2,
        timestamp: Math.round(off / sr * 1e6), data,
      });
      aenc.encode(ad);
      ad.close();
    }
    await aenc.flush();
    aenc.close();
    return { chunks, desc, count };
  })();

  /* 2) video: her kare kesin zamana sarılıp kodlanır. */
  let encError = null;
  const venc = new VideoEncoder({
    output: (chunk, meta) => {
      const d = meta && meta.decoderConfig && meta.decoderConfig.description;
      if (d && !videoDesc) videoDesc = d instanceof ArrayBuffer ? new Uint8Array(d) : new Uint8Array(d.buffer, d.byteOffset, d.byteLength);
      if (isMp4) mp4Muxer.addVideo(chunk);   // anında kopyala, native nesneyi bırak
      else webmMuxer.addVideo(chunk);
    },
    error: e => { encError = e; },
  });
  const vconf = {
    codec: plan.vEnc, width: state.exportW, height: state.exportH,
    bitrate: exportBitrate(), framerate: fps,
    avc: plan.vKind === "avc" ? { format: "avc" } : undefined,
  };
  /* cihazın donanım kodlayıcısını zorla; yoksa yazılım "quality" modu
     (realtime modu yazılım kodlayıcıda parlama/pompalama yapabiliyor) */
  let configured = false;
  for (const cfg of [
    { ...vconf, hardwareAcceleration: "prefer-hardware", latencyMode: "realtime" },
    { ...vconf, latencyMode: "quality" },
    vconf,
  ]) {
    try {
      const s = await VideoEncoder.isConfigSupported(cfg);
      if (s.supported) { venc.configure(cfg); configured = true; break; }
    } catch (_) {}
  }
  if (!configured) venc.configure(vconf);

  /* kare üretici (60+ fps): her kare bir önceki ÇIKTI karesiyle
     harmanlanır (echo blend) — çoğaltılmış kaynak kareleri kademeli
     geçişe dönüşür, hareket akıcılaşır */
  const useFrameGen = state.frameGen && fps >= 60;
  let prevOutCv = null;
  if (useFrameGen) {
    prevOutCv = document.createElement("canvas");
    prevOutCv.width = state.exportW;
    prevOutCv.height = state.exportH;
  }

  for (let i = 0; i < frames; i++) {
    if (exportAbort) { venc.close(); throw new Error("abort"); }
    if (encError) { throw encError; }
    const t = Math.min(i / fps, Math.max(total - .001, 0));
    const loc = locate(t);
    if (loc && loc.clip.type === "video") {
      await seekVideoExact(loc.clip.el, loc.clip.in + loc.offset * loc.clip.speed);
    }
    await renderSeekExtras(t);
    state.t = t;
    drawFrame();
    if (useFrameGen) {
      if (i > 0) {
        ctx.globalAlpha = .45;
        ctx.drawImage(prevOutCv, 0, 0);
        ctx.globalAlpha = 1;
      }
      prevOutCv.getContext("2d").drawImage(canvas, 0, 0);   // harmanlanmış çıktıyı sakla
    }
    const frame = new VideoFrame(canvas, {
      timestamp: Math.round(i * 1e6 / fps),
      duration: Math.round(1e6 / fps),
    });
    venc.encode(frame, { keyFrame: i % (fps * 5) === 0 });
    frame.close();
    /* bir sonraki kare farklı klipteyse o klibi beklemeden ön-ısıt */
    if (i + 1 < frames) {
      const nl = locate(Math.min((i + 1) / fps, total - .001));
      if (nl && nl.clip !== (loc && loc.clip) && nl.clip.type === "video") {
        try { nl.clip.el.currentTime = nl.clip.in + nl.offset * nl.clip.speed; } catch (_) {}
      }
    }
    /* kodlayıcı kuyruğu şişmesin: uyku yerine dequeue olayını bekle
       (CPU boşta durmaz, kuyruk boşalır boşalmaz devam edilir) */
    const queueCap = state.exportW * state.exportH > 1920 * 1080 ? 8 : 20;
    while (venc.encodeQueueSize > queueCap && !encError && !exportAbort) {
      await Promise.race([
        new Promise(r => venc.addEventListener("dequeue", r, { once: true })),
        new Promise(r => setTimeout(r, 50)),
      ]);
    }
    $("#progressInner").style.width = (i / frames * 100).toFixed(1) + "%";
    $("#modalDesc").textContent = `Kare ${i + 1} / ${frames}`;
  }
  await venc.flush();
  venc.close();

  /* paralel yürüyen ses işini topla (kareler zaten anında eklendi) */
  const audioRes = await audioJob;
  if (audioRes && audioRes.count > 0) {
    audioIncluded = true;
    audioDesc = audioRes.desc;
    if (plan.aKind === "opus" && audioRes.desc) opusHead = audioRes.desc;
  }
  if (exportAbort) throw new Error("abort");

  let blob, ext;
  if (isMp4) {
    blob = mp4Muxer.finish({
      vcodec: plan.vKind === "avc" ? "avc" : "vp9",
      vdesc: videoDesc || new Uint8Array(0),
      acodec: audioIncluded ? plan.aKind : null,
      adesc: audioIncluded ? audioDesc : null,
      sampleRate: 48000, channels: 2,
    });
    ext = "mp4";
  } else {
    if (audioIncluded) for (const c of audioRes.chunks) webmMuxer.addAudio(c);
    blob = webmMuxer.finish({ hasAudio: audioIncluded, opusHead });
    ext = "webm";
  }
  finishExportUI();
  exportDone(blob, ext);
  seekTo(0, true);
}

/* ---------- yedek: gerçek zamanlı kayıt (MediaRecorder) ---------- */
async function realtimeExport() {
  const mimes = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm",
    "video/mp4",
  ];
  const mime = mimes.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) { toast("Bu tarayıcı video kaydını desteklemiyor"); return; }
  const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";

  state.exporting = true;   // gerçek zamanlı kayıtta da arka plan siyah olsun
  setCanvasResolution(true);
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
  } catch (_) { audioCtx = null; }

  const canvasStream = canvas.captureStream(state.fps);
  let stream = canvasStream;
  if (audioCtx) {
    const dest = audioCtx.createMediaStreamDestination();
    const master = audioCtx.createGain();
    master.connect(audioCtx.destination);
    master.connect(dest);
    const els = state.clips.filter(c => c.type === "video").map(c => c.el);
    for (const o of state.overlays) if (o.kind === "pip" && o.type === "video") els.push(o.el);
    const bassByEl = new Map();
    for (const m of state.musics) { els.push(m.el); if (m.bass > 0) bassByEl.set(m.el, m.bass); }
    for (const el of new Set(els)) {
      try { getSource(el).disconnect(); } catch (_) {}
      try {
        if (bassByEl.has(el)) {   // bas güçlendirme filtresi
          const f = audioCtx.createBiquadFilter();
          f.type = "lowshelf"; f.frequency.value = 150; f.gain.value = bassByEl.get(el);
          getSource(el).connect(f); f.connect(master);
        } else getSource(el).connect(master);
      } catch (_) {}
    }
    stream = new MediaStream([...canvasStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  }

  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: exportBitrate() });
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

  exportModal("Dışa aktarılıyor…", "Video gerçek zamanlı işleniyor, sekmeyi kapatma.");

  const done = new Promise(res => recorder.onstop = res);
  seekTo(0, true);
  await new Promise(r => setTimeout(r, 250)); // ilk kare otursun
  recorder.start(500);
  play();

  const total = totalDur();
  await new Promise(res => {
    const iv = setInterval(() => {
      $("#progressInner").style.width = Math.min(state.t / total * 100, 100) + "%";
      if (exportAbort || (!state.playing && state.t >= total - .05)) {
        clearInterval(iv);
        res();
      }
    }, 120);
  });

  if (recorder.state !== "inactive") recorder.stop();
  await done;
  pause();
  finishExportUI();

  if (exportAbort) return;

  const blob = new Blob(chunks, { type: mime.split(";")[0] });
  exportDone(blob, ext);
}

/* ---------- proje kaydet / yükle ---------- */
function projectData() {
  return {
    aspect: state.aspect,
    resolution: state.resolution,
    fps: state.fps,
    upscale: state.upscale,
    frameGen: state.frameGen,
    format: state.format,
    fastMode: state.fastMode,
    leadGap: state.leadGap,
    clips: state.clips.map(c => ({
      mediaId: c.mediaId, type: c.type, name: c.name, natDur: c.natDur, color: c.color,
      in: c.in, out: c.out, speed: c.speed, volume: c.volume,
      pitchShift: c.pitchShift, tx: c.tx, ty: c.ty, scale: c.scale,
      filter: c.filter, adjust: { ...c.adjust }, effects: [...(c.effects || [])], trans: { ...c.trans },
    })),
    /* el/url DOM nesneleri IDB'ye yazılamaz; medya mediaId ile geri yüklenir */
    overlays: state.overlays.map(o => { const { el, url, ...rest } = o; return { ...rest }; }),
    musics: state.musics.map(m => ({
      mediaId: m.mediaId, name: m.name, natDur: m.natDur,
      start: m.start, in: m.in, out: m.out, speed: m.speed, volume: m.volume, bass: m.bass || 0,
    })),
  };
}

async function saveProject() {
  if (!state.projectId) return;
  if (!state.clips.length && !state.overlays.length) return;
  const data = projectData();
  const s = JSON.stringify(data);
  if (s === lastSavedJson) return;
  lastSavedJson = s;
  await idbPut("projects", {
    id: state.projectId,
    name: state.projectName,
    updatedAt: Date.now(),
    dur: totalDur(),
    thumb: state.clips.find(c => c.thumb)?.thumb || null,
    data,
  }).catch(() => {});
}
/* otomatik kayıt: editördeyken her 2.5 sn'de değişiklik varsa yaz */
setInterval(() => { if ($("#home").style.display === "none") saveProject(); }, 2500);
window.addEventListener("pagehide", () => saveProject());
document.addEventListener("visibilitychange", () => { if (document.hidden) saveProject(); });

function resetEditorState() {
  pause();
  state.clips = [];
  state.overlays = [];
  for (const m of state.musics) m.el.pause();
  state.musics = [];
  state.leadGap = 0;
  state.t = 0;
  state.selClip = null;
  state.selOv = null;
  lastSavedJson = "";
  $("#emptyState").style.display = "flex";
  $("#btnExport").disabled = true;
}

async function newProject(tool) {
  resetEditorState();
  state.projectId = "p" + Date.now();
  const all = await idbAll("projects").catch(() => []);
  state.projectName = "Proje " + (all.length + 1);
  state.aspect = "9:16";
  state.resolution = 720;
  state.fps = 30;
  state.upscale = false;
  state.frameGen = false;
  state.format = "mp4";
  state.fastMode = false;
  applyAspect();
  clearHistory();
  pendingTool = tool || null;
  enterEditor();
  $("#fileVideo").click();
}

async function openProject(rec) {
  resetEditorState();
  state.projectId = rec.id;
  state.projectName = rec.name;
  state.aspect = rec.data.aspect || "9:16";
  state.resolution = rec.data.resolution || 720;
  state.fps = rec.data.fps || 30;
  state.upscale = !!rec.data.upscale;
  state.frameGen = !!rec.data.frameGen;
  state.format = rec.data.format || "mp4";
  state.fastMode = !!rec.data.fastMode;
  state.leadGap = rec.data.leadGap || 0;
  applyAspect();
  toast("Proje açılıyor…");
  for (const cd of rec.data.clips) {
    if (cd.type === "color") {   // düz renk arka plan: medya yok
      const c = { ...mkClip("color", "", cd.name || "Arka Plan", null, cd.natDur || 3), ...cd, el: null, url: "" };
      c.id = idSeq++;
      c.adjust = { ...cd.adjust };
      c.trans = { ...cd.trans };
      c.effects = cd.effects ? [...cd.effects] : (cd.effect && cd.effect !== "none" ? [cd.effect] : []);
      c.thumb = colorThumb(cd.color || "#000");
      state.clips.push(c);
      continue;
    }
    const m = await idbGet("media", cd.mediaId).catch(() => null);
    if (!m) continue;
    const url = URL.createObjectURL(m.blob);
    let el;
    if (cd.type === "image") {
      el = new Image();
      await new Promise(r => { el.onload = r; el.onerror = r; el.src = url; });
    } else {
      el = document.createElement("video");
      el.preload = "auto";
      el.playsInline = true; el.setAttribute("playsinline", "");
      el.addEventListener("seeked", invalidate);
      el.src = url;
      await new Promise(r => { el.onloadedmetadata = r; el.onerror = r; });
    }
    const c = { ...mkClip(cd.type, url, cd.name, el, cd.natDur), ...cd, el, url, thumb: null };
    c.id = idSeq++;
    c.adjust = { ...cd.adjust };
    c.trans = { ...cd.trans };
    /* eski projeler tekil "effect" alanı kullanır */
    c.effects = cd.effects ? [...cd.effects] : (cd.effect && cd.effect !== "none" ? [cd.effect] : []);
    if (cd.type === "image") c.thumb = makeThumb(el, el.naturalWidth, el.naturalHeight);
    else grabThumb(c);
    state.clips.push(c);
  }
  state.overlays = [];
  for (const od of rec.data.overlays || []) {
    const o = { ...od, id: idSeq++ };
    if (o.kind === "pip") {
      const m = await idbGet("media", o.mediaId).catch(() => null);
      if (!m) continue;
      o.url = URL.createObjectURL(m.blob);
      if (o.type === "image") {
        o.el = new Image();
        await new Promise(r => { o.el.onload = r; o.el.onerror = r; o.el.src = o.url; });
      } else {
        o.el = document.createElement("video");
        o.el.preload = "auto";
        o.el.playsInline = true; o.el.setAttribute("playsinline", "");
        o.el.addEventListener("seeked", invalidate);
        o.el.src = o.url;
        await new Promise(r => { o.el.onloadedmetadata = r; o.el.onerror = r; });
      }
    }
    state.overlays.push(o);
  }
  /* müzik parçaları (eski tek müzikli kayıtlarla geriye uyumlu) */
  const musicDefs = rec.data.musics ||
    (rec.data.music ? [{ ...rec.data.music, start: 0, in: 0, out: null, speed: 1 }] : []);
  state.musics = [];
  for (const md of musicDefs) {
    const rec2 = await idbGet("media", md.mediaId).catch(() => null);
    if (!rec2) continue;
    const url = URL.createObjectURL(rec2.blob);
    const a = new Audio(url);
    a.preload = "auto";
    await new Promise(r => { a.onloadedmetadata = r; a.onerror = r; });
    const natDur = md.natDur || (isFinite(a.duration) ? a.duration : 60);
    state.musics.push({
      id: idSeq++, mediaId: md.mediaId, name: md.name, url, el: a,
      natDur, start: md.start || 0, in: md.in || 0, bass: md.bass || 0,
      out: md.out == null ? natDur : md.out,
      speed: md.speed || 1, volume: md.volume ?? .8,
    });
  }
  lastSavedJson = JSON.stringify(projectData());
  clearHistory();
  if (state.clips.length) {
    $("#emptyState").style.display = "none";
    $("#btnExport").disabled = false;
  }
  enterEditor();
  seekTo(0, true);
}

async function deleteProject(rec) {
  if (!confirm(`"${rec.name}" silinsin mi?`)) return;
  await idbDel("projects", rec.id).catch(() => {});
  /* başka projede kullanılmayan medyaları temizle */
  const remaining = await idbAll("projects").catch(() => []);
  const used = new Set();
  for (const p of remaining) {
    (p.data.clips || []).forEach(c => used.add(c.mediaId));
    (p.data.overlays || []).forEach(o => { if (o.mediaId) used.add(o.mediaId); });
    (p.data.musics || []).forEach(m => used.add(m.mediaId));
    if (p.data.music) used.add(p.data.music.mediaId);
  }
  const ids = new Set();
  (rec.data.clips || []).forEach(c => ids.add(c.mediaId));
  (rec.data.overlays || []).forEach(o => { if (o.mediaId) ids.add(o.mediaId); });
  (rec.data.musics || []).forEach(m => ids.add(m.mediaId));
  if (rec.data.music) ids.add(rec.data.music.mediaId);
  for (const id of ids) if (!used.has(id)) await idbDel("media", id).catch(() => {});
  renderProjectList();
}

function renameProject(rec) {
  const name = prompt("Proje adı:", rec.name);
  if (!name) return;
  rec.name = name.trim() || rec.name;
  idbPut("projects", rec).then(renderProjectList).catch(() => {});
  if (state.projectId === rec.id) state.projectName = rec.name;
}

/* ---------- ana ekran ---------- */
async function renderProjectList() {
  const list = $("#projList");
  const all = (await idbAll("projects").catch(() => []))
    .sort((a, b) => b.updatedAt - a.updatedAt);
  list.innerHTML = "";
  if (!all.length) {
    list.innerHTML = `<div id="projEmpty">Henüz proje yok.<br>Başlamak için “＋ Yeni proje”ye dokun.</div>`;
    return;
  }
  for (const rec of all) {
    const card = document.createElement("button");
    card.className = "projCard";
    const d = new Date(rec.updatedAt);
    const dateStr = d.toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit" }) +
      " " + d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    card.innerHTML = `
      <span class="pthumb"${rec.thumb ? ` style="background-image:url(${rec.thumb})"` : ""}></span>
      <span class="pinfo">
        <span class="pname">${rec.name.replace(/</g, "&lt;")}</span>
        <span class="pmeta">${fmt(rec.dur || 0)} · ${dateStr}</span>
      </span>
      <span class="pbtn ren">✏️</span>
      <span class="pbtn del">🗑</span>`;
    card.querySelector(".ren").addEventListener("click", e => { e.stopPropagation(); renameProject(rec); });
    card.querySelector(".del").addEventListener("click", e => { e.stopPropagation(); deleteProject(rec); });
    card.addEventListener("click", () => openProject(rec));
    list.appendChild(card);
  }
}

  saveProject();
  pause();

  renderProjectList();
}
function enterEditor() {
  $("#home").style.display = "none";

  renderAll();
}

/* ---------- Profesyonel (masaüstü) mod ---------- */
function applyPro(on) {
  document.body.classList.toggle("pro", on);
  const sw = $("#proToggle");
  sw.classList.toggle("on", on);
  sw.setAttribute("aria-checked", on ? "true" : "false");
  try { localStorage.setItem("pc_pro", on ? "1" : "0"); } catch (_) {}
  if (on && innerWidth < 760) toast("Pro düzen geniş ekranda / telefonu yatay çevirince görünür");
  /* editördeysek yeni yerleşime göre önizleme + zaman çizelgesini tazele */
  if ($("#home").style.display === "none") {
    requestAnimationFrame(() => { fitPreview(); setCanvasResolution(false); renderTimeline(); scrollToTime(true); });
  }
}
$("#proToggle").onclick = () => applyPro(!document.body.classList.contains("pro"));
$("#btnFullscreen").onclick = () => {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) {
    (d.exitFullscreen || d.webkitExitFullscreen || (() => {})).call(d);
  } else {
    const el = d.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => toast("Tam ekran desteklenmiyor"))).call(el);
  }
};
try { if (localStorage.getItem("pc_pro") === "1") applyPro(true); } catch (_) {}
addEventListener("resize", () => { if (document.body.classList.contains("pro") && $("#home").style.display === "none") { fitPreview(); setCanvasResolution(false); } });

$("#btnHome").onclick = showHome;
$("#btnNewProject").onclick = () => newProject();
$("#btnNewPhoto").onclick = () => newProject();
document.querySelectorAll(".hTool").forEach(b => {
  b.addEventListener("click", () => newProject(b.dataset.htool));
});
document.querySelectorAll("#homeNav button").forEach(b => {
  b.addEventListener("click", () => {

  ["Duygusal", "emotional piano", "sakin"], ["Jazz", "jazz vibes", "sakin"], ["Epik", "epic cinematic", "epik"],

  { tag: "Akıcı", pace: 1.3, trans: ["fade", "slidefadeL", "circleout"], filter: "sicak4", effect: "none", anim: "fade" },
  { tag: "Glitch", pace: .8, trans: ["glitchcut1", "rgbsplit", "glitchcut2", "flash_cyan"], filter: "dramatik5", effect: "glitch2", anim: "typewriter" },

  { tag: "Retro", pace: 1.2, trans: ["blindsH8", "wipeR", "dissolve16"], filter: "retro6", effect: "vhs1", anim: "slideUp" },

      `🎵 ${tpl.query} · ${st2.pace}s tempo · ${(TRANSITIONS[pool[0]] || {}).name || ""}` +

$("#tplSearch") && ($("#tplSearch").oninput = () => renderTplList());

function randomTemplate() {
  const keys = obj => Object.entries(obj).filter(([k, v]) => !v.hidden && k !== "none").map(([k]) => k);
  const m = TPL_MUSIC[Math.floor(Math.random() * TPL_MUSIC.length)];
  const tk = keys(TRANSITIONS), fk = keys(FILTERS), ek = keys(EFFECTS);
  return {
    name: "Otomatik · " + m[0], query: m[1],
    style: {
      tag: "Otomatik",
      pace: [.5, .8, 1.2, 1.6][Math.floor(Math.random() * 4)],
      trans: Array.from({ length: 3 + Math.floor(Math.random() * 2) }, () => tk[Math.floor(Math.random() * tk.length)]),
      filter: fk[Math.floor(Math.random() * fk.length)],
      effect: Math.random() < .5 ? "none" : ek[Math.floor(Math.random() * ek.length)],
      anim: ["pop", "fade", "bounce", "slideUp", "typewriter"][Math.floor(Math.random() * 5)],
    },
  };
}
$("#btnAutoTpl").onclick = () => useTemplate(randomTemplate());

function useTemplate(tpl) {

/* seçilen medyaya şablonu uygula: tempo kesimi + geçiş + filtre + efekt + başlık + müzik */
async function applyTemplate(tpl) {
  pushHistory();
  const st2 = tpl.style;
  const MIN_T = 10, MAX_T = 30;
  const n = state.clips.length || 1;
  /* klip başına süre: tempo korunur ama toplam 10-30 sn aralığına oturtulur */
  let per = st2.pace;
  if (per * n < MIN_T) per = MIN_T / n;
  if (per * n > MAX_T) per = Math.max(MAX_T / n, .4);
  const pool = Array.isArray(st2.trans) ? st2.trans : [st2.trans];
  const styleClip = (c, i) => {
    c.filter = st2.filter;
    c.effects = st2.effect !== "none" ? [st2.effect] : [];
    const maxOut = c.type === "image" ? c.in + 600 : c.natDur;
    c.out = clamp(c.in + per * c.speed, c.in + .2, maxOut);
    const trKey = pool[i % pool.length];
    const spec = TRANSITIONS[trKey] || {};
    c.trans = { type: trKey, dur: spec.defDur || Math.min(.5, per / 2) };
  };
  state.clips.forEach(styleClip);
  /* videolar kısaysa (uzatılamıyorsa) klipleri döngüyle çoğaltarak 10 sn'yi doldur */
  let guard = 0;
  while (clipsDur() < MIN_T - .01 && state.clips.length && guard < 60) {
    const copy = cloneClip(state.clips[guard % n]);
    styleClip(copy, n + guard);
    state.clips.push(copy);
    guard++;
  }
  /* 30 sn'yi aşarsa sondan kısalt */
  while (clipsDur() > MAX_T + .01 && state.clips.length > 1) {
    const last = state.clips[state.clips.length - 1];
    const excess = clipsDur() - MAX_T;
    if (clipDur(last) - excess >= .3) { last.out -= excess * last.speed; break; }
    state.clips.pop();
  }
  if (state.clips.length) state.clips[state.clips.length - 1].trans = { type: "none", dur: .5 };
  state.overlays.push({
    id: idSeq++, kind: "text", content: tpl.name.replace(" · Otomatik", ""),
    start: 0, dur: Math.min(2.5, Math.max(totalDur(), 1)),
    x: .5, y: .16, size: .065, color: "#fff", bg: true, animIn: st2.anim, loop: "none",
  });
  renderAll();
  seekTo(0, true);
  toast("Şablon uygulandı ✨");
  try {
    const items = await MUSIC_LIBS.itunes.search(tpl.query);
    if (items.length) {
      const pick = items[Math.floor(Math.random() * Math.min(items.length, 5))];
      const u = await pick.resolve();
      if (u) {
        await addMusicFromUrl(u, pick.title);
        const m = state.musics[state.musics.length - 1];
        m.start = 0;
        const nd = contentEnd();
        if (nd > .3 && m.start + musicDur(m) > nd) m.out = Math.min(m.in + nd * m.speed, m.natDur);
        renderTimeline();
      }
    }
  } catch (_) { toast("Şablon müziği yüklenemedi (internet gerekli)"); }
}

      state.frameGen = true; if (state.fps < 60) state.fps = 60; enterEditor(); toast("🎞 Kare üretici açıldı (60 fps)");

    ["🪄", "Otomatik Edit", "Videolarını seç; tempo kesimi, geçiş, filtre, efekt ve müziği otomatik uygular.", async () => {

    card.querySelector(".pmeta").textContent = desc;

    list.appendChild(card);
  }
}
